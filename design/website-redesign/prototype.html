<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PLANIGAMES Website-Probedesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PLANIGAMES – Probedesign v5 „Durchdacht“
   Optik wie die Live-Seite (Schwarz + Orange/Gold, Clash Display, Archivo, JetBrains Mono).
   Aufbau nach Konzept: jeder Abschnitt beantwortet genau eine Besucherfrage, ein Hauptbutton pro
   Abschnitt, der Status eines Spiels bestimmt den nächsten Schritt, keine Sackgassen.
   Die blauen Konzept-Notizen (an/aus unten rechts) erklären jede Entscheidung.
   ===================================================================== */
:root{
  color-scheme:dark;
  --bg:#050505; --card:rgba(255,255,255,.025); --card2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
  --ink:#f4f4f5; --ink2:#d4d4d8; --ink3:#a1a1aa; --ink4:#71717a;
  --acc:#ff7d1a; --acc2:#e6a015; --acc3:#ffa53d; --on-acc:#fff;
  --g:24px; --max:1152px; --sec:clamp(64px,7.4vw,104px); --r:16px; --r2:24px;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:"Clash Display","Archivo",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (max-width:560px){:root{--g:16px;--r2:20px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-color:var(--bg);background-image:radial-gradient(120% 70% at 50% -10%,rgba(255,125,26,.08),transparent 55%),radial-gradient(100% 60% at 50% 115%,rgba(230,160,21,.05),transparent 60%);background-attachment:fixed}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{list-style:none;padding:0}
[hidden]{display:none !important}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:calc(var(--max) + 2 * var(--g));margin:0 auto;padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.sec{padding-top:var(--sec);padding-bottom:var(--sec)}
.sec + .sec{padding-top:0}

/* ---------- Schrift (wie live) ---------- */
.h1{font-family:var(--fd);font-weight:700;font-size:clamp(46px,6.8vw,88px);line-height:.95;letter-spacing:-.025em;color:#fff}
.h1.sm{font-size:clamp(40px,5.4vw,72px)}
.h2{font-family:var(--fd);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.05;letter-spacing:-.015em;color:#fff}
.h3{font-family:var(--fd);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.005em;color:#fff}
.h1,.h2,.h3{overflow-wrap:break-word}
.grad{background:linear-gradient(110deg,var(--acc2),var(--acc) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker,.badge,.more,.lang,.lbl{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.kicker{display:block;color:var(--acc);margin-bottom:12px}
.lead{font-size:clamp(17px,1.5vw,19px);line-height:1.6;color:var(--ink2)}
.lbl{color:var(--ink4)}
p{color:var(--ink3)}
.txt p + p{margin-top:1em}
.txt b{color:var(--ink);font-weight:600}
.c{text-align:center}

/* Abschnittskopf: immer gleich aufgebaut – Kicker · Titel · ein Satz (· Link) */
.sh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:32px}
.sh > div{max-width:680px}
.sh .lead{margin-top:10px}
.sh .more{white-space:nowrap}

/* ---------- Bedienelemente (wie live) ---------- */
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border:0;border-radius:999px;cursor:pointer;font-weight:600;font-size:16px;line-height:1.25;white-space:nowrap;transition:transform .3s var(--ease),box-shadow .3s,background .3s}
.btn .ic{width:17px;height:17px;transition:transform .35s var(--ease)}
.btn:hover .ic{transform:translateX(3px)}
.btn-p{background:linear-gradient(110deg,var(--acc),var(--acc2));color:var(--on-acc);box-shadow:0 10px 40px -10px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 14px 44px -10px color-mix(in srgb,var(--acc) 85%,transparent)}
.btn-g{box-shadow:inset 0 0 0 1px var(--line2);background:transparent;color:var(--ink)}
.btn-g:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);background:rgba(255,255,255,.04)}
.btn-g:hover .ic{transform:none}
.btn-s{padding:10px 20px;font-size:14px}
.more{display:inline-flex;align-items:center;gap:8px;color:var(--acc);transition:gap .3s var(--ease)}
.more:hover{gap:12px}
.more.dim{color:var(--ink4)} .more.dim:hover{color:#fff}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);background:rgba(5,5,5,.55);color:var(--ink2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--dot,var(--acc))}
.badge.paused i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.card{border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}

/* ---------- Konzept-Notizen (blau = Erklärung, nicht Teil des Designs) ---------- */
.cn{display:none;gap:12px;align-items:flex-start;margin:0 0 24px;padding:12px 14px;border-radius:12px;background:rgba(56,189,248,.08);box-shadow:inset 0 0 0 1px rgba(56,189,248,.45);color:#bae6fd;font-size:13.5px;line-height:1.5;text-align:left}
body.cn-on .cn{display:flex}
.cn .n{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:#38bdf8;color:#04111a;font-weight:700;font-size:12px}
.cn b{color:#e0f2fe;font-weight:600}
.hero .cn{max-width:640px}

/* ---------- Kopfzeile ---------- */
.hd{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px);transition:background .35s,box-shadow .35s}
.hd.solid{background:rgba(5,5,5,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.hd-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.brand{display:flex;align-items:center;gap:10px;justify-self:start}
.wm{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.01em;color:#fff}
.wm span{background:linear-gradient(110deg,#e6a015,#ff7d1a 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:30px}
.nav a{font-size:14px;font-weight:500;color:var(--ink3);transition:color .2s}
.nav a:hover,.nav a.on{color:#fff}
.hd-r{display:flex;align-items:center;gap:12px;justify-self:end}
.tip{font-size:14px;font-weight:500;color:var(--ink3);padding:8px 4px;transition:color .2s}
.tip:hover{color:#fff}
.lang{padding:7px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink4)}
.lang b{color:var(--ink);font-weight:500}
.burger{display:none;position:relative;width:42px;height:42px;border:0;background:none;cursor:pointer}
.burger i{position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:#fff;transition:transform .35s var(--ease),top .35s var(--ease),opacity .2s}
.burger i:nth-child(1){top:14px} .burger i:nth-child(2){top:20px} .burger i:nth-child(3){top:26px}
.burger[aria-expanded="true"] i:nth-child(1){top:20px;transform:rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){top:20px;transform:rotate(-45deg)}
.mn{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;gap:28px;padding:104px var(--g) calc(28px + env(safe-area-inset-bottom,0px));background:rgba(5,5,5,.97);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.mn.open{opacity:1;visibility:visible;transition:opacity .3s}
.mn nav{display:grid}
.mn nav a{padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:-.01em}
.mn .row{margin-top:auto}

/* ---------- ① Kopfbereich: Wer seid ihr – und was kann ich jetzt tun? ---------- */
.hero{position:relative;min-height:max(640px,90vh);display:flex;align-items:center;padding:120px 0 64px;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-3}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  linear-gradient(90deg,rgba(5,5,5,.94) 0%,rgba(5,5,5,.78) 38%,rgba(5,5,5,.35) 70%,rgba(5,5,5,.25) 100%),
  linear-gradient(0deg,var(--bg) 0%,rgba(5,5,5,0) 32%),linear-gradient(180deg,rgba(5,5,5,.6),rgba(5,5,5,0) 22%)}
.grid-lines{position:absolute;inset:0;z-index:-1;opacity:.5;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%)}
.fx{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fx i{position:absolute;bottom:-24px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;opacity:0;background:radial-gradient(circle,#ffd1a6 0%,rgba(255,125,26,.45) 45%,transparent 70%);animation:rise var(--t) linear var(--d) infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}80%{opacity:.5}100%{transform:translate3d(var(--dx),-92vh,0);opacity:0}}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:48px;align-items:end}
.hero .badge{margin-bottom:26px}
.hero .lead{max-width:600px;margin-top:24px}
.hero .row{margin-top:32px}
.now{padding:20px;border-radius:var(--r2);background:rgba(10,10,12,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line2),0 30px 60px -30px rgba(0,0,0,.8)}
.now .badge{margin:0 0 16px;background:none}
.now .lg{margin-bottom:12px}
.now p{font-size:14.5px;line-height:1.5;color:var(--ink2);margin-bottom:14px}
.now .prog-top{margin-bottom:6px}
.now .bar{margin-bottom:18px}
.now .btn{width:100%}

/* Laufband (wie live) */
.tick{overflow:hidden;white-space:nowrap;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tick-in{display:inline-flex;align-items:center;gap:28px;padding-left:28px;animation:tick 45s linear infinite;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:-.01em}
.tick-in span{color:rgba(255,255,255,.55)}
.tick-in span:nth-child(4n+3){color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.35)}
.tick-in i{font-style:normal;color:var(--acc);font-size:15px}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- ② Spiele: Was macht ihr? ---------- */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.gcard{display:flex;flex-direction:column;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card);overflow:hidden;transition:box-shadow .3s,transform .4s var(--ease)}
.gcard:hover{box-shadow:inset 0 0 0 1px var(--line2);transform:translateY(-3px)}
.gcard figure{position:relative;aspect-ratio:16/10;overflow:hidden;background:#111}
.gcard figure > img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.gcard:hover figure > img{transform:scale(1.05)}
.gcard figure .badge{position:absolute;left:14px;top:14px}
.gcard figure .tag{position:absolute;right:14px;top:14px;padding:5px 10px;border-radius:999px;background:var(--acc);color:#1a0d00;font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.gcard-b{display:flex;flex-direction:column;gap:8px;padding:20px 22px 22px;flex:1}
.gcard-b p{font-size:14.5px;line-height:1.5}
.next{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px;color:#fff}
.next .ic{width:18px;height:18px;color:var(--gacc,var(--acc));transition:transform .3s var(--ease)}
.gcard:hover .next .ic{transform:translateX(3px)}
.next small{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);font-weight:400;margin-bottom:2px}
.demos-line{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:16px 22px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card);transition:box-shadow .3s}
.demos-line:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.demos-line span:first-child{display:flex;align-items:center;gap:14px;color:var(--ink2)}
.demos-line b{color:#fff;font-weight:600}
.demos-line .emo{font-size:22px}
.lg{display:block;position:relative;overflow:hidden;width:calc(var(--w) * var(--k,1));max-width:100%}
.lg img{position:absolute;max-width:none;height:auto}

/* ---------- ③ Devlog-Liste: Tut sich da was? ---------- */
.plist{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:104px 130px minmax(0,1fr) auto;gap:22px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);transition:background .25s}
.prow:hover{background:rgba(255,255,255,.025)}
.prow figure{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#111}
.prow figure img{width:100%;height:100%;object-fit:cover}
.ph-img{filter:brightness(.55) saturate(.85)}
.prow-d{font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:var(--ink4);line-height:1.5}
.prow-t .badge{padding:0;box-shadow:none;background:none;color:var(--ink4);margin-bottom:4px}
.prow-h{display:block;font-weight:600;font-size:17px;color:#fff;transition:color .2s}
.prow-e{display:block;font-size:14px;color:var(--ink3);margin-top:2px}
.prow:hover .prow-h{color:var(--acc3)}
.prow > .ic{width:18px;height:18px;color:var(--ink4);transition:transform .3s var(--ease),color .2s}
.prow:hover > .ic{transform:translateX(3px);color:#fff}

/* ---------- ④ Studio: Wer steckt dahinter? ---------- */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start;margin-bottom:48px}
.about .txt{font-size:17px}
.about .more{margin-top:18px}
.sub{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 16px}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:56px}
.val{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;padding:18px 20px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.val .emo{font-size:22px;line-height:1.2;grid-row:1/3}
.val .h3{font-size:17px}
.val p{font-size:14px;line-height:1.5}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tm{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 18px;align-items:center;padding:16px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.tm figure{grid-row:1/5;width:88px;height:88px;border-radius:20px;overflow:hidden;background:#111}
.tm img{width:100%;height:100%;object-fit:cover}
.tm .h3{font-size:18px}
.tm .badge{padding:0;box-shadow:none;background:none;color:var(--acc)}
.tm .q{font-size:14px;color:var(--ink2);line-height:1.45}
.tm .loc{font-size:12.5px;color:var(--ink4)}

/* ---------- ⑤ Bleib dran ---------- */
.join{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);
  background:radial-gradient(80% 120% at 0% 0%,rgba(255,125,26,.18),transparent 60%),radial-gradient(60% 100% at 100% 100%,rgba(230,160,21,.1),transparent 60%),var(--card)}
.join > div{padding:clamp(28px,4.5vw,52px)}
.join-co{box-shadow:inset 1px 0 0 var(--line)}
.join .h2{margin-bottom:12px}
.join-co .emo{font-size:28px;display:block;margin-bottom:12px}
.join-co .h3{font-size:23px;margin-bottom:8px}
.join-co .row{margin-top:20px}
.nl{display:flex;gap:10px;margin-top:24px;max-width:520px}
.nl input,.idea input{flex:1;min-width:0;height:52px;padding:0 20px;border:0;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line2);outline:0;font-size:16px;transition:box-shadow .2s}
.nl input:focus,.idea input:focus{box-shadow:inset 0 0 0 1px var(--acc)}
.nl input::placeholder,.idea input::placeholder{color:var(--ink4)}
.nl .btn,.idea .btn{padding:0 24px;height:52px}
.ok{margin-top:14px;color:var(--ink);font-weight:500}

/* ---------- Footer (wie live) ---------- */
.ft{border-top:1px solid var(--line);padding-top:56px}
.ft-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:40px;padding-bottom:44px}
.ft-brand p{max-width:330px;margin-top:16px;font-size:15px}
.ft-col .lbl{display:block;margin-bottom:16px}
.ft-col ul{display:grid;gap:10px}
.ft-col a{font-size:15px;color:var(--ink2);transition:color .2s}
.ft-col a:hover{color:#fff}
.ft-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:13px;color:var(--ink4)}
.ft-bot span{display:flex;flex-wrap:wrap;gap:8px 22px}
.ft-bot a:hover{color:#fff}

/* ---------- Seitenköpfe & Unterseiten ---------- */
.ph{padding-top:clamp(124px,15vh,168px);padding-bottom:clamp(36px,4vw,56px)}
.ph .lead{max-width:620px;margin-top:18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.filters button{padding:7px 14px;border:0;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);background:none;cursor:pointer;font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);transition:color .2s,background .2s,box-shadow .2s}
.filters button:hover{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.filters button.on{background:#fff;color:#050505;box-shadow:none}
.build{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,255,255,.02)}
.build + .build{margin-top:10px}
.build .emo{font-size:22px}
.build b{display:block;font-weight:600;color:#fff}
.build small{display:block;font-family:var(--fm);font-size:11px;letter-spacing:.06em;color:var(--ink4)}
.build button{margin-left:auto;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);background:none;cursor:pointer;color:var(--ink2)}
.build button:hover{background:var(--acc);color:#fff;box-shadow:none}
.build button .ic{width:17px;height:17px}

/* ---------- Spielseite (feste Reihenfolge der Fragen) ---------- */
.gh{position:relative;min-height:max(600px,82vh);display:flex;align-items:flex-end;padding:120px 0 56px;overflow:hidden;isolation:isolate}
.gh-media{position:absolute;inset:0;z-index:-2}
.gh-media img{width:100%;height:100%;object-fit:cover}
.gh::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 0%,rgba(5,5,5,.72) 32%,rgba(5,5,5,.15) 70%,rgba(5,5,5,.5) 100%),linear-gradient(90deg,rgba(5,5,5,.6),rgba(5,5,5,0) 65%)}
.gh .lg{margin:20px 0 16px}
.gh-tag{font-size:clamp(18px,1.7vw,22px);color:var(--ink2);max-width:640px}
.gh .row{margin-top:26px}
.rt{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,72px)}
.rt .txt{font-size:17px}
.sb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 20px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.sb dt{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);padding-top:3px}
.sb dd{color:#fff;font-weight:500}
.vids{display:grid;gap:20px}
.vids.two{grid-template-columns:1fr 1fr}
.vid{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r2);overflow:hidden;background:#111}
.vid img{width:100%;height:100%;object-fit:cover;filter:brightness(.7);transition:transform .8s var(--ease),filter .4s}
.vid:hover img{transform:scale(1.04);filter:brightness(.85)}
.vid-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;padding:20px;text-align:center}
.vid-c .btn{pointer-events:none}
.vid-c small{font-size:12.5px;color:var(--ink2);text-shadow:0 1px 10px rgba(0,0,0,.7)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.gal figure{border-radius:var(--r);overflow:hidden;background:#111}
.gal img{width:100%;aspect-ratio:16/10;object-fit:cover;transition:transform .8s var(--ease)}
.gal figure:hover img{transform:scale(1.04)}
.feats{display:grid;grid-template-columns:repeat(var(--fc,4),minmax(0,1fr));gap:14px}
.feats .val{grid-template-columns:1fr;gap:6px}
.feats .val .emo{grid-row:auto;margin-bottom:6px}
.lore{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:14px;min-height:200px;padding:clamp(22px,3.5vw,36px);border-radius:var(--r2);overflow:hidden;position:relative;isolation:isolate}
.lore img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.lore::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,5,5,.9),rgba(5,5,5,.3))}
.lore p{color:var(--ink2);margin-top:6px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.prog-top b{font-family:var(--fd);font-weight:700;font-size:24px}
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.progress{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:start}
.progress .prog{padding:22px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.progress .prog p{font-size:14px;margin-top:14px}
.paused-note{display:flex;gap:12px;padding:16px 18px;margin-bottom:14px;border-radius:var(--r);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2);font-size:14.5px}
.paused-note .more{margin-top:6px}
.rm{display:grid;gap:10px}
.rm li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.rm li.active{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 6%,transparent)}
.rm .dotc{width:14px;height:14px;margin-top:4px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.rm .done .dotc{background:var(--acc);box-shadow:none}
.rm .active .dotc{box-shadow:inset 0 0 0 2px var(--acc)}
.rm .lbl{display:block}
.rm .active .lbl{color:var(--acc)}
.rm b{display:block;font-weight:600;color:#fff;line-height:1.35;margin-top:2px}
.rm p{font-size:14px;margin-top:2px}
.rm.muted li{opacity:.55}
.mit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.mit > .card{padding:clamp(24px,3.5vw,36px)}
.mit .h3{font-size:24px;margin-bottom:8px}
.mit .wl{background:radial-gradient(90% 120% at 0% 0%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 65%),var(--card)}
.idea form{display:flex;gap:10px;margin-top:20px}
.votes{display:grid;gap:8px;margin-top:14px}
.votes li{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;color:var(--ink2)}
.vote{display:grid;justify-items:center;min-width:44px;padding:5px 0;border:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line2);background:none;cursor:pointer;font-weight:700;font-size:13px;color:#fff;transition:box-shadow .2s,color .2s,background .2s}
.vote .ic{width:13px;height:13px}
.vote:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.vote.on{background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc3)}
.try{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;padding:16px 20px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.try p{color:var(--ink2)}
.try p b{color:#fff}
.faq{max-width:820px}
.faq details{border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.faq details + details{margin-top:10px}
.faq summary{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;cursor:pointer;list-style:none;font-weight:600;color:#fff}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{width:18px;height:18px;color:var(--ink3);transition:transform .3s var(--ease)}
.faq details[open] summary .ic{transform:rotate(45deg)}
.faq .a{padding:0 20px 18px}
.more2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

/* ---------- Devlog & Beitrag ---------- */
.posts{display:grid;gap:14px;padding-bottom:var(--sec)}
.pcard{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:center;padding:12px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card);transition:box-shadow .3s}
.pcard:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.pcard figure{position:relative;aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:#111}
.pcard figure > img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.pcard:hover figure > img{transform:scale(1.04)}
.card-logo{position:absolute !important;left:50%;top:50%;transform:translate(-50%,-50%)}
.pcard-b{padding:6px 12px 6px 0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:var(--ink4)}
.meta .badge{padding:3px 10px}
.pcard .h3{font-size:24px;margin:10px 0 6px;transition:color .2s}
.pcard:hover .h3{color:var(--acc3)}
.pcard p{font-size:15px;margin-bottom:12px}
.empty{padding:28px;text-align:center;color:var(--ink4)}
.post{max-width:780px;margin:0 auto}
.post .more.dim{margin-bottom:26px}
.post .h1{font-size:clamp(28px,4.6vw,56px);margin:18px 0 26px}
.post-img{border-radius:var(--r2);overflow:hidden;margin-bottom:36px}
.post-img img{width:100%;aspect-ratio:16/9;object-fit:cover}
.prose{color:#c7c7d1;font-size:17px;line-height:1.78;overflow-wrap:break-word}
.prose p{color:#c7c7d1;margin:0 0 1.1em}
.prose h2{font-family:var(--fd);font-weight:700;font-size:26px;line-height:1.2;color:#fff;margin:1.8em 0 .55em;overflow-wrap:break-word}
.prose h2 .emo{margin-right:10px}
.prose ul{margin:0 0 1.2em;padding-left:1.25em;list-style:disc}
.prose li{margin:.35em 0}
.prose li::marker{color:var(--acc)}
.prose b{color:#fff;font-weight:600}
.prose hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.post-end{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-top:48px}
.post-end > a{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:20px 22px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card);transition:box-shadow .2s}
.post-end > a:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.post-end b{display:block;font-family:var(--fd);font-weight:700;font-size:20px;color:#fff;margin-top:4px}
.post-end .game{background:radial-gradient(90% 140% at 0% 0%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 65%),var(--card)}

/* ---------- Konzept-Übersicht ---------- */
.kz{display:grid;gap:18px;padding-bottom:var(--sec)}
.kz .card{padding:clamp(22px,3.5vw,36px)}
.kz .h2{font-size:clamp(26px,3vw,34px);margin-bottom:16px}
.kz ol.q{counter-reset:q;display:grid;gap:10px}
.kz ol.q li{counter-increment:q;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:baseline;color:var(--ink2)}
.kz ol.q li::before{content:counter(q);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#38bdf8;color:#04111a;font-weight:700;font-size:12px}
.kz ol.q b,.kz li b{color:#fff;font-weight:600}
.kz .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kz .three > div{padding:18px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,255,255,.02)}
.kz .three b{display:block;color:#fff;margin:6px 0 4px}
.kz .three p{font-size:14.5px}
.kz ul.rules{display:grid;gap:10px}
.kz ul.rules li{padding-left:22px;position:relative;color:var(--ink2)}
.kz ul.rules li::before{content:"→";position:absolute;left:0;color:var(--acc)}
.kz table{width:100%;border-collapse:collapse;font-size:14.5px}
.kz th{text-align:left;font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);font-weight:400;padding:0 12px 10px 0}
.kz td{padding:12px 12px 12px 0;border-top:1px solid var(--line);color:var(--ink2);vertical-align:top}
.kz td:first-child{color:#fff;font-weight:600;white-space:nowrap}
.kz .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

/* ---------- Probedesign-Menü + Notizen-Schalter ---------- */
.dock{position:fixed;z-index:90;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:0;cursor:pointer;border-radius:999px;background:rgba(20,20,22,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line2);font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);list-style:none}
.pill::-webkit-details-marker{display:none}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.cn-btn[aria-pressed="true"]{background:#38bdf8;color:#04111a;box-shadow:none}
.pv{position:relative}
.pv-list{position:absolute;right:0;bottom:46px;display:grid;min-width:230px;padding:8px;border-radius:16px;background:rgba(20,20,22,.97);box-shadow:inset 0 0 0 1px var(--line2),0 20px 60px rgba(0,0,0,.5)}
.pv-list a{padding:9px 10px;border-radius:9px;font-size:14px;color:var(--ink3)}
.pv-list a:hover,.pv-list a.on{color:#fff;background:rgba(255,255,255,.06)}
.pv-list .sep{height:1px;background:var(--line);margin:6px 4px}
.pv-cn{padding:9px 10px;border:0;border-radius:9px;background:rgba(56,189,248,.1);color:#bae6fd;font-size:14px;text-align:left;cursor:pointer;margin-bottom:4px}
.pv-cn:hover{background:rgba(56,189,248,.2)}

/* Einblenden: nur Bewegung, Inhalte sind immer sichtbar */
.rv{transform:translateY(20px);transition:transform .9s var(--ease)}
.rv.in{transform:none}
@media (prefers-reduced-motion:reduce){.rv{transform:none;transition:none}.fx,.pulse{display:none}.tick-in{animation:none}}

/* ---------- Tablet ---------- */
@media (max-width:1024px){
  .tip{display:none}
  .feats{--fc:2}
  .team{grid-template-columns:minmax(0,1fr)}
  .tm{grid-template-columns:72px minmax(0,1fr)}
  .tm figure{width:72px;height:72px}
}
@media (max-width:900px){
  .nav,.lang,.hd-r > .btn{display:none}
  .burger{display:block}
  .hd-in{grid-template-columns:minmax(0,1fr) auto;height:64px}
  .hero-grid,.about,.rt,.progress,.mit,.join,.post-end,.kz .two{grid-template-columns:minmax(0,1fr)}
  .hero-grid{gap:28px}
  .now{max-width:420px}
  .cards3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .join-co{box-shadow:inset 0 1px 0 var(--line)}
  .ft-top{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ft-brand{grid-column:1/-1}
  .prow{grid-template-columns:84px minmax(0,1fr) auto}
  .prow-d{display:none}
  .vids.two{grid-template-columns:minmax(0,1fr)}
  .kz .three{grid-template-columns:minmax(0,1fr)}
}
/* ---------- Handy ---------- */
@media (max-width:640px){
  .hero{min-height:auto;padding:104px 0 48px}
  .hero::before{background:linear-gradient(0deg,var(--bg) 0%,rgba(5,5,5,.72) 40%,rgba(5,5,5,.45) 100%)}
  .gh .lg,.now .lg{--k:.7}
  .btn{padding:13px 22px;font-size:15px;white-space:normal;text-align:center}
  .row .btn{flex:1 1 auto}
  .cards3,.vals,.feats,.more2,.gal{grid-template-columns:minmax(0,1fr)}
  .nl,.idea form{flex-direction:column}
  .nl input,.idea input{flex:none;height:50px}
  .nl .btn,.idea .btn{height:50px}
  .pcard{grid-template-columns:minmax(0,1fr);gap:12px}
  .pcard-b{padding:4px 8px 8px}
  .ft-top{grid-template-columns:minmax(0,1fr)}
  .ft-bot{flex-direction:column}
  .tick-in{font-size:18px}
  .prose h2{font-size:21px}
  .prose,.prose h2,.post .h1{hyphens:auto}
  .try,.demos-line{flex-direction:column;align-items:flex-start}
  .dock{top:calc(env(safe-area-inset-top,0px) + 13px);bottom:auto;right:62px;align-items:flex-start}
  .pill{height:36px;padding:0 12px}
  .cn-btn{display:none}
  .pv-t{display:none}
  .pv-list{top:44px;bottom:auto}
  .kz table,.kz tbody,.kz tr,.kz td{display:block;width:100%}
  .kz thead{display:none}
  .kz tr{padding:12px 0;border-top:1px solid var(--line)}
  .kz td{border:0;padding:2px 0}
  .kz td:first-child{white-space:normal;margin-bottom:4px}
  .kz td:nth-child(2)::before{content:"Vorher: ";color:var(--ink4)}
  .kz td:nth-child(3)::before{content:"Jetzt: ";color:var(--acc)}
}
</style>

<script>
"use strict";
/* ---------- Bilder ---------- */
const MEDIA_MAP = null;   // im Vorschau-Paket ersetzt: { "/media/…": "media/…" } (Bilder liegen dann neben der Seite)
const MEDIA = new URLSearchParams(location.search).get("media") || "https://planigames.com";
const M = (p) => { if (!p) return ""; const k = p.split("#")[0]; if (MEDIA_MAP) return MEDIA_MAP[k] || ""; return /^https?:/.test(k) ? k : MEDIA + k; };
const focus = (p) => { const m = String(p || "").match(/#focus=(\d+),(\d+)/); return m ? m[1] + "% " + m[2] + "%" : "50% 50%"; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const paras = (s) => String(s).split(/\n\s*\n/).map((p) => `<p>${inl(p.trim())}</p>`).join("");
const yt = (id) => "https://www.youtube.com/watch?v=" + id;
const BOX = {
  "/media/frontliners-logo-weiss.svg": [0.0688, 0.3596, 0.9587, 0.6367, 3.0],
  "/media/fok-logo-tempv01.png": [0.044, 0.1009, 0.9535, 0.8991, 1.5175],
  "/media/wobblywizards-logo.png": [0.0807, 0.1759, 0.9245, 0.8417, 1.7778],
  "/media/logo-6.png": [0.1583, 0.1583, 0.8417, 0.8417, 1],
};
function logo(src, alt, area, cls = "", maxH = 1e9) {
  const [x0, y0, x1, y1, ar] = BOX[src] || [0, 0, 1, 1, 1];
  const fw = x1 - x0, fh = y1 - y0, va = ar * fw / fh;
  const h = Math.min(Math.sqrt(area / va), maxH), w = h * va;
  return `<span class="lg ${cls}" ${alt ? `role="img" aria-label="${esc(alt)}"` : 'aria-hidden="true"'} style="--w:${w.toFixed(1)}px;aspect-ratio:${va.toFixed(4)}">`
    + `<img src="${M(src)}" alt="" style="width:${(100 / fw).toFixed(3)}%;left:${(-100 * x0 / fw).toFixed(3)}%;top:${(-100 * y0 / fh).toFixed(3)}%"></span>`;
}

const BODIES = {"willkommen-im-devlog": "Hallo und herzlich willkommen! 👋\r\n\r\nAb heute gibt es bei **PLANIGAMES** ein offenes Entwicklungstagebuch. Hier erfährst du als Erste*r, woran wir gerade basteln — vom kleinsten Bugfix bis zum großen Feature.\r\n\r\n## Was dich erwartet\r\n\r\n- Regelmäßige **Devlog-Einträge** zu Wobbly Wizards\r\n- Detaillierte **Patch Notes** zu jedem Build\r\n- Blicke hinter die Kulissen: Konzepte, Prototypen, Fehlschläge\r\n\r\nBleib dran — die Magie fängt gerade erst an. 🪄", "wobbly-wizards-ist-erstmal-pausiert": "Aufgrund der Entwicklung an Fall of Kings und WARCATS haben wir unsere Ressourcen und unser Team fürs erste von Wobbly Wizards abgezogen. Aber Wobbly Wizards wird nicht komplett vergessen, freut euch auf zukünftige Updates zum Game!", "frontliners-devlog-1": "Zerstörbare Gebäude, dynamisches Wetter, neue Fahrzeuge und vieles mehr!\r\n\r\nIn den vergangenen Wochen hat sich bei FRONTLINERS einiges getan! Wir haben zahlreiche neue Features integriert, bestehende Systeme überarbeitet und intensiv an der Performance sowie am Gameplay gearbeitet.\r\n\r\nVon einer weitgehend zerstörbaren Spielwelt über neun unterschiedliche Fahrzeuge bis hin zu neuen Spielmodi und umfangreichen Anpassungsmöglichkeiten – hier erfahrt ihr, was sich verändert hat!\r\n\r\n💥 Zerstörbare Spielwelt\r\n\r\nEines unserer bisher größten Features ist die Zerstörung kompletter Gebäude!\r\n\r\nGroße Teile der Spielwelt sind mittlerweile zerstörbar. Dadurch kann sich das Schlachtfeld während einer laufenden Runde erheblich verändern. Gebäude, die zunächst als Deckung dienen, können vollständig zerstört werden und neue taktische Möglichkeiten eröffnen.\r\n\r\n🌪️ Dynamisches Wetter\r\n\r\nMit unserem neuen Wettersystem kann sich das Wetter jetzt auch während eines Matches verändern.\r\n\r\nSo können beispielsweise plötzlich Sandstürme aufziehen, die die Sichtverhältnisse beeinflussen und für völlig neue Kampfsituationen sorgen.\r\n\r\n🚁 Neun Fahrzeuge und Fahrzeug-Customizing\r\n\r\nMittlerweile haben wir neun unterschiedliche Fahrzeuge integriert, die jeweils eigene Stärken und Einsatzmöglichkeiten besitzen.\r\n\r\nZusätzlich verfügen Fahrzeuge jetzt über passende Sounds und freischaltbare Tarnungen.\r\n\r\nFür zukünftige Updates planen wir außerdem ein umfangreicheres Fahrzeug-Customizing, mit dem sich beispielsweise auch unterschiedliche Bordwaffen ausrüsten lassen.\r\n\r\n🎮 Zahlreiche neue Spielmodi\r\n\r\nAuch bei den Spielmodi haben wir ordentlich nachgelegt. Aktuell sind folgende Modi integriert:\r\n\r\n- Hot Zone\r\n- Eroberung\r\n- Team Deathmatch (TDM)\r\n- Deathmatch (FFA)\r\n- 1v1, 2v2, 3v3 und 4v4\r\n- Waffenspiel\r\n- Search and Destroy\r\n\r\nWeitere Spielmodi sind bereits geplant!\r\n\r\n🔫 Loadouts, Inventar und Customizing\r\n\r\nUnser Loadout-Editor wurde vollständig überarbeitet und optisch an das restliche Spiel angepasst.\r\n\r\nAußerdem haben wir ein funktionierendes Inventarsystem integriert und zahlreiche neue Anpassungsmöglichkeiten hinzugefügt.\r\n\r\nDazu gehören unter anderem Waffen-, Soldaten- und Fahrzeugtarnungen, die freigeschaltet und ausgerüstet werden können.\r\n\r\n🏆 Karriere, Challenges und Ingame-Shop\r\n\r\nMit dem neuen Karrieresystem und zahlreichen Challenges gibt es jetzt zusätzliche Fortschrittsmöglichkeiten.\r\n\r\nVerdientes Ingame-Geld lässt sich außerdem im neuen Shop ausgeben, um kosmetische Inhalte und Loot-Kisten freizuschalten.\r\n\r\nDie Kisten können verschiedene Belohnungen enthalten, darunter XP, Ingame-Geld, Tarnungen, Calling Cards und Spielertitel.\r\n\r\n🤖 Verbesserte Bots und Gameplay-Balancing\r\n\r\nWir haben intensiv an unserer Bot-KI gearbeitet, damit sich computergesteuerte Soldaten intelligenter verhalten.\r\n\r\nZusätzlich wurden zahlreiche Balancing-Anpassungen vorgenommen, um Waffen, Fahrzeuge und das allgemeine Gameplay besser aufeinander abzustimmen.\r\n\r\n⚡ Performance, DLSS und FSR\r\n\r\nAuch technisch hat sich einiges getan!\r\n\r\nMit der Integration von NVIDIA DLSS und AMD FSR stehen neue Möglichkeiten zur Performance-Optimierung zur Verfügung.\r\n\r\nDarüber hinaus haben wir zahlreiche weitere Optimierungen vorgenommen. Unser Ziel bleibt, FRONTLINERS auch auf weniger leistungsstarken PCs möglichst flüssig spielbar zu machen.\r\n\r\n🖥️ Neues HUD, Deploy-Karte und Audio\r\n\r\nZum Abschluss haben wir auch die Benutzeroberfläche umfangreich überarbeitet.\r\n\r\nDas HUD wurde modernisiert und eine interaktive Deploy-Karte integriert, die eine bessere Übersicht über das Schlachtfeld bietet.\r\n\r\nAußerdem haben wir große Teile des Spiels mit passenden Sounds ausgestattet, darunter die unterschiedlichen Fahrzeuge.\r\n\r\n---\r\n\r\n🚀 Wie geht es weiter?\r\n\r\nFRONTLINERS hat in den vergangenen Wochen einen großen Entwicklungsschritt gemacht. Doch wir sind noch lange nicht fertig!\r\n\r\nIn den kommenden Updates wollen wir unter anderem das Fahrzeug-Customizing erweitern, zusätzliche Spielmodi integrieren und weiter an Performance, Balancing und der Zerstörung der Spielwelt arbeiten.\r\n\r\nUnser Ziel bleibt ein dynamischer Multiplayer-Shooter, bei dem sich jedes Match anders anfühlt.\r\n\r\nWir freuen uns darauf, euch schon bald weitere Einblicke in die Entwicklung von FRONTLINERS zu geben!", "frontliners-devlog-2": "Die Entwicklung von FRONTLINERS geht weiter! In den vergangenen Tagen haben wir uns besonders intensiv mit der technischen Grundlage unseres Shooters beschäftigt.\r\n\r\nVor allem unser Zerstörungssystem hat uns vor einige Herausforderungen gestellt. Gleichzeitig wurde an neuen Maps, der Fahrzeugsteuerung und zahlreichen Gameplay-Verbesserungen gearbeitet.\r\n\r\nHier gibt es einen Einblick in unseren aktuellen Entwicklungsstand!\r\n\r\n💥 Zerstörung 2.0 – Mehr als nur explodierende Gebäude\r\n\r\nUnser bisher größter Schwerpunkt ist weiterhin die Zerstörung der Spielwelt.\r\n\r\nDabei orientieren wir uns an Spielen wie THE FINALS, in denen Gebäude nicht einfach nur auseinanderfliegen, sondern physikalisch nachvollziehbar auf Beschädigungen reagieren.\r\n\r\nIn unseren bisherigen Tests konnten wir bereits deutliche Performance-Verbesserungen erzielen. Gleichzeitig haben wir festgestellt, dass unser bisheriger technischer Ansatz langfristig nicht unseren Qualitätsansprüchen entspricht.\r\n\r\nDeshalb haben wir uns entschieden, das System grundlegend neu aufzubauen.\r\n\r\nUnser Ziel für das neue Zerstörungssystem:\r\n\r\n- Präzise Beschädigungen, beispielsweise einzelne Löcher durch Raketeneinschläge\r\n- Gebäude, deren tragende Strukturen tatsächlich eine Rolle spielen\r\n- Realistisch einstürzende Gebäudeteile statt zufälliger Explosionen\r\n- Trümmer, die als Deckung dienen und das Schlachtfeld verändern\r\n- Deutlich bessere Performance auch bei umfangreicher Zerstörung\r\n- Einheitliche, synchronisierte Zerstörung im Multiplayer\r\n\r\nDabei arbeiten wir an einer Kombination aus eigener Gebäudestatik, vorbereiteten Bruchstrukturen und optimierter Physiksimulation.\r\n\r\nDas Ganze ist technisch anspruchsvoll, aber für uns eines der wichtigsten Systeme von FRONTLINERS.\r\n\r\n🗺️ Neue Maps und verbessertes Leveldesign\r\n\r\nAuch bei unseren Schlachtfeldern geht es voran!\r\n\r\nMit einer weiteren Map, die intern unter anderem als Apocalypse geführt wird, testen wir neue Umgebungen und unterschiedliche Geländeaufbauten.\r\n\r\nDabei beschäftigen wir uns besonders mit der Spielbarkeit der Karten: Laufwege, Deckungsmöglichkeiten, Fahrzeugbewegungen und die Verteilung wichtiger Kampfbereiche.\r\n\r\nZusätzlich arbeiten wir an Verbesserungen der Geländekollisionen und der Performance größerer Umgebungen.\r\n\r\nLangfristig möchten wir unterschiedliche Schauplätze bieten, damit sich FRONTLINERS nicht ausschließlich auf Wüstenlandschaften beschränkt.\r\n\r\n🚁 Helikopter und Bewegungsmechaniken\r\n\r\nAuch die Fahrzeugsteuerung bekommt weitere Aufmerksamkeit.\r\n\r\nInsbesondere unsere Helikopter sollen sich deutlich natürlicher steuern lassen. Statt einer stark automatisierten Flugbewegung möchten wir ein Fluggefühl erreichen, bei dem Neigung, Geschwindigkeit und Steuerbewegungen besser zusammenspielen.\r\n\r\nParallel dazu überarbeiten wir verschiedene Bewegungsmechaniken unserer Soldaten.\r\n\r\nDazu gehört unter anderem das Vaulting-System, mit dem Hindernisse zuverlässig überwunden werden sollen, ohne dass normale Treppen oder kleinere Höhenunterschiede zu ungewollten Animationen führen.\r\n\r\n🌐 Multiplayer und Server-Performance\r\n\r\nEin weiteres großes Thema ist die Multiplayer-Architektur.\r\n\r\nGerade bei großflächiger Zerstörung, zahlreichen Bots und Fahrzeugen muss sichergestellt werden, dass alle Spieler einen konsistenten Spielzustand erleben.\r\n\r\nDafür arbeiten wir an einer effizienteren Aufteilung zwischen Server und Clients.\r\n\r\nUnser Ziel ist es, dass der Server wichtige Gameplay-Ereignisse und physikalisch relevante Zustände kontrolliert, während die Clients weniger wichtige Effekte lokal darstellen können.\r\n\r\nDadurch möchten wir sowohl die Netzwerkbelastung als auch die benötigte Rechenleistung reduzieren.\r\n\r\n🔧 Bugfixes, Tests und Optimierungen\r\n\r\nNeben den großen Systemen beschäftigen uns natürlich auch zahlreiche kleinere Baustellen.\r\n\r\nDazu zählen unter anderem Fahrzeugkollisionen, Sitzpositionen, Schatten, die Darstellung der Deploy-Karte und verschiedene Probleme bei der Navigation durch unsere Spielwelt.\r\n\r\nBesonders intensiv testen wir aktuell, wie sich Zerstörung, Bots und Fahrzeuge gegenseitig beeinflussen.\r\n\r\nDabei geht es uns nicht einfach darum, möglichst viele Features einzubauen, sondern die vorhandenen Systeme zuverlässig und performant miteinander funktionieren zu lassen.\r\n\r\n---\r\n\r\n🚀 Wie geht es weiter?\r\n\r\nUnser größtes Ziel für die nächsten Entwicklungsschritte ist ein stabiles, überzeugendes und multiplayerfähiges Zerstörungssystem.\r\n\r\nGleichzeitig werden wir weiter an unseren Maps, der Fahrzeugsteuerung, den Bewegungsmechaniken und der allgemeinen Performance arbeiten.\r\n\r\nFRONTLINERS befindet sich weiterhin mitten in der Entwicklung. Nicht jeder Ansatz funktioniert direkt beim ersten Versuch – und manchmal bedeutet Fortschritt auch, ein bestehendes System noch einmal grundlegend zu überdenken.\r\n\r\nGenau das gehört für uns zur Spieleentwicklung dazu.\r\n\r\nWir freuen uns darauf, euch schon bald weitere Ergebnisse zeigen zu können!\r\n\r\n– Das PLANIGAMES Entwicklerteam"};

/* Devlog-Text: Absätze, Listen, **fett**, Emoji-Zeilen werden zu Zwischenüberschriften */
function prose(src) {
  let out = "", para = [], list = [];
  const fp = () => { if (para.length) { out += `<p>${inl(para.join(" "))}</p>`; para = []; } };
  const fl = () => { if (list.length) { out += `<ul>${list.map((x) => `<li>${inl(x)}</li>`).join("")}</ul>`; list = []; } };
  for (const raw of String(src || "").replace(/\r/g, "").split("\n")) {
    const l = raw.trim();
    if (!l) { fp(); fl(); continue; }
    if (/^-{3,}$/.test(l)) { fp(); fl(); out += "<hr>"; continue; }
    if (/^#{1,3}\s/.test(l)) { fp(); fl(); out += `<h2>${inl(l.replace(/^#+\s*/, ""))}</h2>`; continue; }
    const em = l.match(/^((?:\p{Extended_Pictographic}|️|‍)+)\s*(.+)$/u);
    if (em && l.length < 90 && !/[.!:]$/.test(l)) { fp(); fl(); out += `<h2><span class="emo">${em[1]}</span>${inl(em[2])}</h2>`; continue; }
    if (/^[-*]\s+/.test(l)) { fp(); list.push(l.replace(/^[-*]\s+/, "")); continue; }
    fl(); para.push(l);
  }
  fp(); fl();
  return out;
}

  ${sh("Einblicke", v.length > 1 ? "Trailer &amp; Gameplay" : "So sieht's aus", "")}
  <div class="vids${v.length > 1 ? " two" : ""}">${v.map(([id, t, poster]) => `<a class="vid rv" href="${yt(id)}" target="_blank" rel="noopener" aria-label="${esc(t)} auf YouTube ansehen"><img src="${M(poster)}" alt="" loading="lazy" style="object-position:${focus(poster)}"><span class="vid-c"><span class="btn btn-p btn-s">${ic("play")} ${esc(t)} ansehen</span><small>Öffnet YouTube in einem neuen Tab</small></span></a>`).join("")}</div>
  ${gal.length ? `<div class="gal">${gal.map((s) => `<figure class="rv"><img src="${M(s)}" alt="" loading="lazy"></figure>`).join("")}</div>` : ""}
</div></section>`);
  if (g.features) out.push(`<section class="sec"><div class="wrap">
  ${cn(n++, "Was erwartet mich?", "Die Features als gleich große Kacheln – auf einen Blick vergleichbar, keine einsame Kachel in der letzten Reihe.")}
  ${sh("Was dich erwartet", esc(g.features.h), "")}
  <div class="feats" style="--fc:${Math.min(4, g.features.items.length)}">${g.features.items.map(([e, t, d]) => `<div class="val rv"><span class="emo">${e}</span><h3 class="h3">${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}</div>
  ${g.lore ? `<a class="lore rv" href="#" onclick="return false"><img src="${M(g.cover)}" alt="" loading="lazy" style="object-position:${focus(g.cover)}"><span><h3 class="h3">${esc(g.lore.h)}</h3><p>${esc(g.lore.t)}</p></span><span class="btn btn-g btn-s">${esc(g.lore.b)} ${ic("arrow")}</span></a>` : ""}
</div></section>`);
  if (g.roadmap) { const p = pct(g.roadmap), lab = { done: "Erledigt", active: "In Arbeit", planned: "Geplant" };
    out.push(`<section class="sec"><div class="wrap">
  ${cn(n++, "Wie weit seid ihr?", g.paused ? "Ehrlich statt veraltet: Das Spiel ist pausiert, also steht das oben. Termine, die in der Vergangenheit liegen, sind entfernt." : "Fortschritt als Zahl und als Liste. Was gerade „In Arbeit“ ist, ist hervorgehoben.")}

  <div class="progress"><div class="prog rv"><div class="prog-top"><span class="lbl">Entwicklungs-Fortschritt</span><b class="grad">${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div><p>${g.paused ? "Pausiert – der Fortschritt bleibt erhalten." : `${g.roadmap.filter((x) => x[0] === "done").length} erledigt · ${g.roadmap.filter((x) => x[0] === "active").length} in Arbeit · ${g.roadmap.filter((x) => x[0] === "planned").length} geplant`}</p></div>
  <div>${g.paused ? `<div class="paused-note rv"><span>⏸️</span><span>${esc(g.paused.t)}<br><a class="more" href="#${g.paused.post}">Zum Devlog-Beitrag ${ic("arrow")}</a></span></div>` : ""}
  <ol class="rm${g.paused ? " muted" : ""}">${g.roadmap.map(([s, d, t, x]) => `<li class="${s} rv"><span class="dotc"></span><span><span class="lbl">${d ? esc(d) + " · " : ""}${lab[s]}</span><b>${esc(t)}</b>${x ? `<p>${esc(x)}</p>` : ""}</span></li>`).join("")}</ol></div></div>
</div></section>`); }
  out.push(`<section class="sec" id="s-mitmachen"><div class="wrap">
  ${cn(n++, "Wie kann ich mitmachen?", "Ein Ort zum Mitmachen: Anmeldung und Ideen nebeneinander (vorher über die Seite verteilt). Gibt es eine Demo, steht sie direkt darunter.")}

  <div class="mit">
    <div class="card wl rv"><h3 class="h3">${esc(g.join.h)}</h3><p>${esc(g.join.t)}</p>${nlForm("wl-" + g.slug, g.join.b, g.join.ok)}</div>
    <div class="card idea rv"><h3 class="h3">${esc(g.ideas.h)}</h3><p>${esc(g.ideas.t)}</p>

function viewDevlog() {
  const tabs = [["", "Alle"], ...GAMES.map((g) => [g.slug, g.title])];
  return `
<section class="wrap ph">
  ${cn("D", "Was ist neu?", "Filter nach Spiel, neueste zuerst. Jede Karte mit Bild, Datum und Spiel – Beiträge ohne Bild bekommen das Cover. Der Test-Beitrag ist nicht mehr öffentlich.")}
  <span class="kicker">Entwicklungstagebuch</span><h1 class="h1 sm">Devlog &amp; Patch Notes</h1><p class="lead">Updates, Patchnotes und Blicke hinter die Kulissen. Frisch aus der Werkstatt.</p>
  <div class="filters" data-filters>${tabs.map(([k, t], i) => `<button type="button" data-f="${k}" class="${i ? "" : "on"}" aria-pressed="${i ? "false" : "true"}">${esc(t)}</button>`).join("")}</div></section>
<section class="wrap"><div class="posts" data-posts>${POSTS.map((p) => {
    const g = G(p.g);
    const fig = p.i ? `<img src="${M(p.i)}" alt="" loading="lazy" style="object-position:${focus(p.i)}">` : `<img class="ph-img" src="${M(g.cover)}" alt="" loading="lazy" style="object-position:${focus(g.cover)}">${logo(g.logo, "", 9000, "card-logo")}`;
    return `<a class="pcard rv" href="#${p.slug}" data-g="${p.g}"><figure>${fig}</figure><div class="pcard-b"><div class="meta"><span>${dLong(p.d)}</span><span class="badge">${esc(g.title)}</span></div><h3 class="h3">${esc(p.t)}</h3><p>${esc(p.e)}</p><span class="more">Weiterlesen ${ic("arrow")}</span></div></a>`;
  }).join("")}<p class="empty card" hidden>Zu diesem Spiel gibt es noch keine Beiträge.</p></div></section>
${footer()}`;
}

function viewPost(slug) {
  const p = P(slug), g = G(p.g), i = POSTS.indexOf(p), nx = POSTS[(i + 1) % POSTS.length];
  const body = BODIES[slug] || p.e, min = Math.max(1, Math.round(body.split(/\s+/).length / 200));
  return `
<article class="wrap ph"><div class="post">
  ${cn("B", "Lesen – und dann?", "Zwischenüberschriften aus den Emoji-Zeilen machen lange Beiträge überfliegbar. Am Ende kein Sackgassen-Ende: weiter zum Spiel (mit seinem nächsten Schritt) oder zum nächsten Beitrag.")}
  <a class="more dim" href="#devlog">${ic("back")} Alle Beiträge</a>
  <div class="meta"><span>${dLong(p.d)} · ${min} Min. Lesezeit</span><span class="badge">${esc(g.title)}</span>${p.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
  <h1 class="h1">${esc(p.t)}</h1>
  ${p.i ? `<figure class="post-img"><img src="${M(p.i)}" alt="" style="object-position:${focus(p.i)}"></figure>` : ""}
  <div class="prose">${prose(body)}</div>
  <div class="post-end" style="${accStyle(g)}">
    <a class="game" href="#${g.slug}">${logo(g.logo, g.title, 9000)}<span><span class="lbl">Mehr zu ${esc(g.title)}</span><b>${esc(g.next.hint)}</b></span><span class="more">Zum Spiel ${ic("arrow")}</span></a>
    <a href="#${nx.slug}"><span><span class="lbl">Nächster Beitrag</span><b>${esc(nx.t)}</b></span><span class="more dim">Weiterlesen ${ic("arrow")}</span></a>
  </div>
</div></article>
<div style="height:var(--sec)"></div>
${footer()}`;
}

/* =================== Verhalten =================== */
const app = document.getElementById("app"), hd = document.getElementById("hd"), pv = document.getElementById("pv");
const mn = document.getElementById("mn"), burger = document.querySelector("[data-burger]"), cnBtn = document.querySelector("[data-cn]");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let io = null, pendingSec = null, parEl = null;

function setMenu(open) { mn.classList.toggle("open", open); mn.setAttribute("aria-hidden", String(!open)); burger.setAttribute("aria-expanded", String(open)); document.body.classList.toggle("lock", open); }
function setNotes(on) { document.body.classList.toggle("cn-on", on); cnBtn.setAttribute("aria-pressed", String(on)); try { sessionStorage.setItem("pg_cn", on ? "1" : ""); } catch (e) { /* ohne Speicher: nur für diesen Besuch */ } }
function marks() { document.querySelectorAll("[data-mark]").forEach((el) => { if (!el.firstChild) { const s = +el.dataset.mark; el.innerHTML = logo("/media/logo-6.png", "", s * s); } }); }
function reveals() {
  if (io) io.disconnect();
  const els = document.querySelectorAll(".rv");
  if (reduced || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
  io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { rootMargin: "0px 0px -6% 0px" });
  els.forEach((e) => io.observe(e));
}
function par() { parEl = reduced ? null : app.querySelector("[data-par]"); parTick(); }
function parTick() { if (parEl && scrollY < innerHeight * 1.2) parEl.style.transform = `translate3d(0,${(scrollY * 0.2).toFixed(1)}px,0)`; }
function wire() {
  app.querySelectorAll("form[data-fake]").forEach((f) => f.addEventListener("submit", (e) => { e.preventDefault(); const ok = f.nextElementSibling; if (ok && ok.classList.contains("ok")) ok.hidden = false; f.reset(); }));
  app.querySelectorAll("[data-vote]").forEach((b) => b.addEventListener("click", () => { const on = b.classList.toggle("on"); b.setAttribute("aria-pressed", String(on)); b.querySelector("span").textContent = +b.dataset.vote + (on ? 1 : 0); }));
  const fl = app.querySelector("[data-filters]");
  if (fl) fl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    fl.querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
    let c = 0;
    app.querySelectorAll("[data-posts] .pcard").forEach((r) => { const show = !b.dataset.f || r.dataset.g === b.dataset.f; r.hidden = !show; c += show ? 1 : 0; });
    app.querySelector("[data-posts] .empty").hidden = c > 0;
  });
  app.querySelectorAll("[data-fakedl]").forEach((b) => b.addEventListener("click", () => { b.title = "Im Probedesign ohne Funktion"; b.animate([{ transform: "translateY(0)" }, { transform: "translateY(3px)" }, { transform: "translateY(0)" }], { duration: 300 }); }));
}
const scrollToSec = (sec) => { const t = document.getElementById("s-" + sec); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + scrollY - (sec === "kontakt" ? 0 : 60), behavior: reduced ? "auto" : "smooth" }); };

function route() {
  const k = (location.hash || "").replace(/^#/, "") || "start";
  let view = "home", html;
  if (k === "spiele") { view = "games"; html = viewGames(); }
  else if (G(k)) { view = k; html = viewGame(k); }
  else if (k === "devlog") { view = "devlog"; html = viewDevlog(); }
  else if (P(k)) { view = "post"; html = viewPost(k); }
  else if (k === "konzept") { view = "konzept"; html = viewKonzept(); }
  else html = viewHome();
  app.innerHTML = html;
  const navKey = view === "games" || G(view) ? "games" : view === "devlog" || view === "post" ? "devlog" : view === "home" ? "studio" : "";
  document.querySelectorAll("[data-nav]").forEach((x) => x.classList.toggle("on", x.dataset.nav === navKey));
  document.querySelectorAll("[data-pv]").forEach((x) => x.classList.toggle("on", x.dataset.pv === view));
  pv.open = false; setMenu(false);
  marks(); wire(); reveals(); par();
  const sec = pendingSec; pendingSec = null;
  if (sec) setTimeout(() => scrollToSec(sec), 60); else window.scrollTo(0, 0);
  hd.classList.toggle("solid", scrollY > 20);
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-sec]"); if (!a) return;
  e.preventDefault();
  const target = a.getAttribute("href").replace(/^#/, ""), cur = (location.hash || "").replace(/^#/, "") || "start";
  setMenu(false);
  if (target !== cur) { pendingSec = a.dataset.sec; location.hash = target; } else scrollToSec(a.dataset.sec);
});
cnBtn.addEventListener("click", () => setNotes(!document.body.classList.contains("cn-on")));
document.querySelector("[data-cn2]").addEventListener("click", () => { setNotes(!document.body.classList.contains("cn-on")); pv.open = false; });
burger.addEventListener("click", () => setMenu(!mn.classList.contains("open")));
mn.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
pv.addEventListener("click", (e) => { if (e.target.closest("a")) pv.open = false; });
addEventListener("keydown", (e) => { if (e.key === "Escape") { setMenu(false); pv.open = false; } });
let rafP = 0;
addEventListener("scroll", () => { hd.classList.toggle("solid", scrollY > 20); if (!rafP) rafP = requestAnimationFrame(() => { rafP = 0; parTick(); }); }, { passive: true });
addEventListener("hashchange", route);
try { if (sessionStorage.getItem("pg_cn") === "1") setNotes(true); } catch (e) { /* ohne Speicher */ }
route();
</script>
</body>
</html>
