<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PLANIGAMES Website-Probedesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PLANIGAMES – Probedesign v4 „Aufgefrischt“
   Basis ist die Live-Seite: gleicher Aufbau, gleiche Farben (Schwarz + Studio-Orange/Gold),
   gleiche Schriften (Clash Display, Archivo, JetBrains Mono), gleiche Bausteine und Texte.
   Aufgefrischt: etwas kleinere Titel, weniger Leerraum, eine Inhaltsbreite, keine Doppelungen,
   nichts schwebt mehr über dem Inhalt.
   ===================================================================== */
:root{
  color-scheme:dark;
  --bg:#050505; --card:rgba(255,255,255,.025); --card2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
  --ink:#f4f4f5; --ink2:#d4d4d8; --ink3:#a1a1aa; --ink4:#71717a;
  --acc:#ff7d1a; --acc2:#e6a015; --acc3:#ffa53d; --on-acc:#fff;
  --g:24px; --max:1152px; --sec:clamp(64px,7.4vw,104px); --r:16px; --r2:24px;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:"Clash Display","Archivo",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (max-width:560px){:root{--g:16px;--r2:20px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-color:var(--bg);background-image:radial-gradient(120% 70% at 50% -10%,rgba(255,125,26,.08),transparent 55%),radial-gradient(100% 60% at 50% 115%,rgba(230,160,21,.05),transparent 60%);background-attachment:fixed}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{list-style:none;padding:0}
[hidden]{display:none !important}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:calc(var(--max) + 2 * var(--g));margin:0 auto;padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.sec{padding-top:var(--sec);padding-bottom:var(--sec)}
.sec + .sec{padding-top:0}

/* ---------- Schrift (wie live) ---------- */
.h1{font-family:var(--fd);font-weight:700;font-size:clamp(46px,6.8vw,88px);line-height:.95;letter-spacing:-.025em;color:#fff}
.h1.sm{font-size:clamp(40px,5.4vw,72px)}
.h2{font-family:var(--fd);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.05;letter-spacing:-.015em;color:#fff}
.h2.lg{font-size:clamp(34px,4.2vw,52px)}
.h3{font-family:var(--fd);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.005em;color:#fff}
.h1,.h2,.h3{overflow-wrap:break-word;hyphens:auto}
.grad{background:linear-gradient(110deg,var(--acc2),var(--acc) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker,.badge,.more,.lang{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.kicker{color:var(--acc);margin-bottom:14px}
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:var(--ink2)}
p{color:var(--ink3)}
.txt p + p{margin-top:1em}
.txt b{color:var(--ink);font-weight:600}
.c{text-align:center}

/* ---------- Bedienelemente (wie live) ---------- */
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.c .row,.row.c{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border:0;border-radius:999px;cursor:pointer;font-weight:600;font-size:16px;line-height:1.25;white-space:nowrap;transition:transform .3s var(--ease),box-shadow .3s,background .3s,border-color .3s}
.btn .ic{width:17px;height:17px;transition:transform .35s var(--ease)}
.btn:hover .ic{transform:translateX(3px)}
.btn-p{background:linear-gradient(110deg,var(--acc),var(--acc2));color:var(--on-acc);box-shadow:0 10px 40px -10px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 14px 44px -10px color-mix(in srgb,var(--acc) 85%,transparent)}
.btn-g{box-shadow:inset 0 0 0 1px var(--line2);background:transparent;color:var(--ink)}
.btn-g:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);background:rgba(255,255,255,.04)}
.btn-g:hover .ic{transform:none}
.btn-s{padding:10px 20px;font-size:14px}
.more{display:inline-flex;align-items:center;gap:8px;color:var(--acc);transition:gap .3s var(--ease)}
.more:hover{gap:12px}
.more.dim{color:var(--ink4)} .more.dim:hover{color:#fff}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);background:rgba(5,5,5,.55);color:var(--ink2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--dot,var(--acc))}
.badge.plain{box-shadow:none;background:none;padding:5px 0;color:var(--ink4)}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.card{border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:32px}
.sec-h .more{white-space:nowrap}

/* ---------- Kopfzeile ---------- */
.hd{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px);transition:background .35s,box-shadow .35s}
.hd.solid{background:rgba(5,5,5,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.hd-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.brand{display:flex;align-items:center;gap:10px;justify-self:start}
.wm{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.01em;color:#fff}
.wm span{background:linear-gradient(110deg,var(--acc2),var(--acc) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:30px}
.nav a{font-size:14px;font-weight:500;color:var(--ink3);transition:color .2s}
.nav a:hover,.nav a.on{color:#fff}
.hd-r{display:flex;align-items:center;gap:12px;justify-self:end}
.tip{font-size:14px;font-weight:500;color:var(--ink3);padding:8px 4px;transition:color .2s}
.tip:hover{color:#fff}
.lang{padding:7px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink4)}
.lang b{color:var(--ink);font-weight:500}
.burger{display:none;position:relative;width:42px;height:42px;border:0;background:none;cursor:pointer}
.burger i{position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:#fff;transition:transform .35s var(--ease),top .35s var(--ease),opacity .2s}
.burger i:nth-child(1){top:14px} .burger i:nth-child(2){top:20px} .burger i:nth-child(3){top:26px}
.burger[aria-expanded="true"] i:nth-child(1){top:20px;transform:rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){top:20px;transform:rotate(-45deg)}
.mn{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;gap:28px;padding:104px var(--g) calc(28px + env(safe-area-inset-bottom,0px));background:rgba(5,5,5,.97);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.mn.open{opacity:1;visibility:visible;transition:opacity .3s}
.mn nav{display:grid}
.mn nav a{padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:-.01em}
.mn .row{margin-top:auto}

/* ---------- Startseite: Kopfbereich (wie live) ---------- */
.hero{position:relative;min-height:max(620px,88vh);display:flex;align-items:center;padding:120px 0 72px;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-3}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  linear-gradient(90deg,rgba(5,5,5,.94) 0%,rgba(5,5,5,.78) 38%,rgba(5,5,5,.35) 70%,rgba(5,5,5,.2) 100%),
  linear-gradient(0deg,var(--bg) 0%,rgba(5,5,5,0) 30%),linear-gradient(180deg,rgba(5,5,5,.6),rgba(5,5,5,0) 22%)}
.grid-lines{position:absolute;inset:0;z-index:-1;opacity:.5;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%)}
.fx{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fx i{position:absolute;bottom:-24px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;opacity:0;background:radial-gradient(circle,#ffd1a6 0%,rgba(255,125,26,.45) 45%,transparent 70%);animation:rise var(--t) linear var(--d) infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}80%{opacity:.5}100%{transform:translate3d(var(--dx),-92vh,0);opacity:0}}
.hero-in{position:relative}
.hero .badge{margin-bottom:28px}
.hero .lead{max-width:640px;margin-top:26px}
.hero .row{margin-top:34px}

/* Laufband (wie live) */
.tick{overflow:hidden;white-space:nowrap;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tick-in{display:inline-flex;align-items:center;gap:28px;padding-left:28px;animation:tick 45s linear infinite;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:-.01em}
.tick-in span:nth-child(4n+3){color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.35)}
.tick-in span{color:rgba(255,255,255,.55)}
.tick-in i{font-style:normal;color:var(--acc);font-size:15px}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- Spiele ---------- */
.feat{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:clamp(20px,3.5vw,48px);align-items:center;padding:14px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card);transition:box-shadow .3s}
.feat:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.feat figure,.gcard figure{position:relative;overflow:hidden;border-radius:var(--r);background:#111}
.feat figure{aspect-ratio:16/10}
.feat img,.gcard img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.feat:hover img,.gcard:hover figure > img{transform:scale(1.05)}
.feat-b{padding:10px clamp(4px,1.5vw,20px) 10px 0}
.feat-b .row{margin:0 0 22px}
.feat-b .lg{margin-bottom:18px}
.feat-b p{font-size:18px;color:var(--ink2);margin-bottom:26px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.gcard{display:flex;flex-direction:column;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card);overflow:hidden;transition:box-shadow .3s,transform .4s var(--ease)}
.gcard:hover{box-shadow:inset 0 0 0 1px var(--line2);transform:translateY(-3px)}
.gcard figure{aspect-ratio:16/10;border-radius:0}
.gcard figure .badge{position:absolute;left:14px;top:14px}
.gcard-b{display:flex;flex-direction:column;gap:8px;padding:20px 22px 22px;flex:1}
.gcard-b p{font-size:14.5px;line-height:1.5}
.gcard-b .more{margin-top:auto;padding-top:10px}
.demo-art{display:grid;place-items:center;height:100%;background:radial-gradient(70% 90% at 50% 100%,rgba(255,125,26,.28),transparent 70%),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/32px 32px,#0b0b0d}
.demo-art span{font-size:44px;filter:drop-shadow(0 6px 18px rgba(255,125,26,.45))}
.lg{display:block;position:relative;overflow:hidden;width:calc(var(--w) * var(--k,1));max-width:100%}
.lg img{position:absolute;max-width:none;height:auto}

/* ---------- Studio (wie live) ---------- */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start;margin-bottom:44px}
.about .txt{padding-top:30px;font-size:17px}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.val{padding:24px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:var(--card);transition:box-shadow .3s,background .3s}
.val:hover{box-shadow:inset 0 0 0 1px var(--line2);background:var(--card2)}
.val .emo{display:block;font-size:26px;line-height:1;margin-bottom:16px}
.val .h3{font-size:18px;margin-bottom:6px}
.val p{font-size:14.5px;line-height:1.55}

/* Team („Die Köpfe dahinter“) */
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:960px;margin:40px auto 0}
.tm{text-align:center}
.tm figure{width:min(100%,210px);aspect-ratio:1;margin:0 auto 18px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#111}
.tm img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.tm:hover img{transform:scale(1.05)}
.tm .badge{padding:0;box-shadow:none;background:none;color:var(--acc);margin:6px 0 10px}
.tm .q{font-size:15px;color:var(--ink2)}
.tm .loc{margin-top:6px;font-size:13px;color:var(--ink4)}

/* Devlog-Liste (wie live, mit Vorschaubild) */
.plist{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:96px 130px minmax(0,1fr) auto;gap:22px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);transition:background .25s}
.prow:hover{background:rgba(255,255,255,.025)}
.prow figure{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#111}
.prow figure img{width:100%;height:100%;object-fit:cover}
.prow .ph-img{filter:brightness(.55) saturate(.85)}
.prow-d{font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:var(--ink4);line-height:1.5}
.prow-t .badge{padding:0;box-shadow:none;background:none;color:var(--ink4);margin-bottom:4px}
.prow-h{display:block;font-weight:600;font-size:17px;color:#fff;transition:color .2s}
.prow:hover .prow-h{color:var(--acc3)}
.prow-e{display:block;font-size:14px;color:var(--ink3);margin-top:2px}
.prow .ic{width:18px;height:18px;color:var(--ink4);transition:transform .3s var(--ease),color .2s}
.prow:hover .ic{transform:translateX(3px);color:#fff}

/* Mitmachen: Newsletter + Community in einem Block */
.join{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);
  background:radial-gradient(80% 120% at 0% 0%,rgba(255,125,26,.18),transparent 60%),radial-gradient(60% 100% at 100% 100%,rgba(230,160,21,.1),transparent 60%),var(--card)}
.join > div{padding:clamp(28px,4.5vw,56px)}
.join-co{box-shadow:inset 1px 0 0 var(--line)}
.join .h2{margin-bottom:14px}
.join-co .emo{font-size:30px;display:block;margin-bottom:14px}
.join-co .h3{font-size:24px;margin-bottom:10px}
.join-co .row{margin-top:22px}
.nl{display:flex;gap:10px;margin-top:26px;max-width:520px}
.c .nl{margin-left:auto;margin-right:auto}
.nl input,.idea input{flex:1;min-width:0;height:52px;padding:0 20px;border:0;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line2);outline:0;font-size:16px;transition:box-shadow .2s}
.nl input:focus,.idea input:focus{box-shadow:inset 0 0 0 1px var(--acc)}
.nl input::placeholder,.idea input::placeholder{color:var(--ink4)}
.nl .btn,.idea .btn{padding:0 24px;height:52px}
.ok{margin-top:14px;color:var(--ink);font-weight:500}

/* ---------- Footer (wie live) ---------- */
.ft{border-top:1px solid var(--line);padding-top:56px}
.ft-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:40px;padding-bottom:44px}
.ft-brand p{max-width:330px;margin-top:16px;font-size:15px}
.ft-col .badge{padding:0;box-shadow:none;background:none;color:var(--ink4);margin-bottom:16px}
.ft-col ul{display:grid;gap:10px}
.ft-col a{font-size:15px;color:var(--ink2);transition:color .2s}
.ft-col a:hover{color:#fff}
.ft-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:13px;color:var(--ink4)}
.ft-bot span{display:flex;flex-wrap:wrap;gap:8px 22px}
.ft-bot a:hover{color:#fff}
.ft-bot .badge{padding:0;box-shadow:none;background:none;color:var(--ink4)}

/* ---------- Seitenköpfe ---------- */
.ph{padding-top:clamp(124px,15vh,168px);padding-bottom:clamp(36px,4vw,56px)}
.ph .lead{max-width:620px;margin-top:20px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.filters button{padding:7px 14px;border:0;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);background:none;cursor:pointer;font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);transition:color .2s,background .2s,box-shadow .2s}
.filters button:hover{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.filters button.on{background:#fff;color:#050505;box-shadow:none}
.demo-list{margin-top:20px;padding:clamp(22px,3vw,32px)}
.demo-list .sec-h{margin-bottom:18px}
.build{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,255,255,.02);transition:box-shadow .2s,background .2s}
.build + .build{margin-top:10px}
.build:hover{box-shadow:inset 0 0 0 1px var(--line2);background:rgba(255,255,255,.04)}
.build .emo{font-size:22px}
.build b{display:block;font-weight:600;color:#fff}
.build small{display:block;font-family:var(--fm);font-size:11px;letter-spacing:.06em;color:var(--ink4)}
.build button{margin-left:auto;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);background:none;cursor:pointer;color:var(--ink2)}
.build button:hover{background:var(--acc);color:#fff;box-shadow:none}
.build button .ic{width:17px;height:17px}

/* ---------- Spielseite (Blöcke wie live) ---------- */
.gh{position:relative;min-height:max(600px,80vh);display:flex;align-items:flex-end;padding:120px 0 56px;overflow:hidden;isolation:isolate}
.gh-media{position:absolute;inset:0;z-index:-2}
.gh-media img{width:100%;height:100%;object-fit:cover}
.gh::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 0%,rgba(5,5,5,.72) 32%,rgba(5,5,5,.15) 70%,rgba(5,5,5,.5) 100%),linear-gradient(90deg,rgba(5,5,5,.6),rgba(5,5,5,0) 65%)}
.gh .lg{margin:22px 0 18px}
.gh-tag{font-size:clamp(18px,1.7vw,22px);color:var(--ink2);max-width:640px}
.gh .row{margin-top:28px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.rt{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(28px,5vw,72px)}
.rt .txt{font-size:17px}
.vids{display:grid;gap:20px}
.vids.two{grid-template-columns:1fr 1fr}

const BODIES = {"willkommen-im-devlog": "Hallo und herzlich willkommen! 👋\r\n\r\nAb heute gibt es bei **PLANIGAMES** ein offenes Entwicklungstagebuch. Hier erfährst du als Erste*r, woran wir gerade basteln — vom kleinsten Bugfix bis zum großen Feature.\r\n\r\n## Was dich erwartet\r\n\r\n- Regelmäßige **Devlog-Einträge** zu Wobbly Wizards\r\n- Detaillierte **Patch Notes** zu jedem Build\r\n- Blicke hinter die Kulissen: Konzepte, Prototypen, Fehlschläge\r\n\r\nBleib dran — die Magie fängt gerade erst an. 🪄", "wobbly-wizards-ist-erstmal-pausiert": "Aufgrund der Entwicklung an Fall of Kings und WARCATS haben wir unsere Ressourcen und unser Team fürs erste von Wobbly Wizards abgezogen. Aber Wobbly Wizards wird nicht komplett vergessen, freut euch auf zukünftige Updates zum Game!", "frontliners-devlog-1": "Zerstörbare Gebäude, dynamisches Wetter, neue Fahrzeuge und vieles mehr!\r\n\r\nIn den vergangenen Wochen hat sich bei FRONTLINERS einiges getan! Wir haben zahlreiche neue Features integriert, bestehende Systeme überarbeitet und intensiv an der Performance sowie am Gameplay gearbeitet.\r\n\r\nVon einer weitgehend zerstörbaren Spielwelt über neun unterschiedliche Fahrzeuge bis hin zu neuen Spielmodi und umfangreichen Anpassungsmöglichkeiten – hier erfahrt ihr, was sich verändert hat!\r\n\r\n💥 Zerstörbare Spielwelt\r\n\r\nEines unserer bisher größten Features ist die Zerstörung kompletter Gebäude!\r\n\r\nGroße Teile der Spielwelt sind mittlerweile zerstörbar. Dadurch kann sich das Schlachtfeld während einer laufenden Runde erheblich verändern. Gebäude, die zunächst als Deckung dienen, können vollständig zerstört werden und neue taktische Möglichkeiten eröffnen.\r\n\r\n🌪️ Dynamisches Wetter\r\n\r\nMit unserem neuen Wettersystem kann sich das Wetter jetzt auch während eines Matches verändern.\r\n\r\nSo können beispielsweise plötzlich Sandstürme aufziehen, die die Sichtverhältnisse beeinflussen und für völlig neue Kampfsituationen sorgen.\r\n\r\n🚁 Neun Fahrzeuge und Fahrzeug-Customizing\r\n\r\nMittlerweile haben wir neun unterschiedliche Fahrzeuge integriert, die jeweils eigene Stärken und Einsatzmöglichkeiten besitzen.\r\n\r\nZusätzlich verfügen Fahrzeuge jetzt über passende Sounds und freischaltbare Tarnungen.\r\n\r\nFür zukünftige Updates planen wir außerdem ein umfangreicheres Fahrzeug-Customizing, mit dem sich beispielsweise auch unterschiedliche Bordwaffen ausrüsten lassen.\r\n\r\n🎮 Zahlreiche neue Spielmodi\r\n\r\nAuch bei den Spielmodi haben wir ordentlich nachgelegt. Aktuell sind folgende Modi integriert:\r\n\r\n- Hot Zone\r\n- Eroberung\r\n- Team Deathmatch (TDM)\r\n- Deathmatch (FFA)\r\n- 1v1, 2v2, 3v3 und 4v4\r\n- Waffenspiel\r\n- Search and Destroy\r\n\r\nWeitere Spielmodi sind bereits geplant!\r\n\r\n🔫 Loadouts, Inventar und Customizing\r\n\r\nUnser Loadout-Editor wurde vollständig überarbeitet und optisch an das restliche Spiel angepasst.\r\n\r\nAußerdem haben wir ein funktionierendes Inventarsystem integriert und zahlreiche neue Anpassungsmöglichkeiten hinzugefügt.\r\n\r\nDazu gehören unter anderem Waffen-, Soldaten- und Fahrzeugtarnungen, die freigeschaltet und ausgerüstet werden können.\r\n\r\n🏆 Karriere, Challenges und Ingame-Shop\r\n\r\nMit dem neuen Karrieresystem und zahlreichen Challenges gibt es jetzt zusätzliche Fortschrittsmöglichkeiten.\r\n\r\nVerdientes Ingame-Geld lässt sich außerdem im neuen Shop ausgeben, um kosmetische Inhalte und Loot-Kisten freizuschalten.\r\n\r\nDie Kisten können verschiedene Belohnungen enthalten, darunter XP, Ingame-Geld, Tarnungen, Calling Cards und Spielertitel.\r\n\r\n🤖 Verbesserte Bots und Gameplay-Balancing\r\n\r\nWir haben intensiv an unserer Bot-KI gearbeitet, damit sich computergesteuerte Soldaten intelligenter verhalten.\r\n\r\nZusätzlich wurden zahlreiche Balancing-Anpassungen vorgenommen, um Waffen, Fahrzeuge und das allgemeine Gameplay besser aufeinander abzustimmen.\r\n\r\n⚡ Performance, DLSS und FSR\r\n\r\nAuch technisch hat sich einiges getan!\r\n\r\nMit der Integration von NVIDIA DLSS und AMD FSR stehen neue Möglichkeiten zur Performance-Optimierung zur Verfügung.\r\n\r\nDarüber hinaus haben wir zahlreiche weitere Optimierungen vorgenommen. Unser Ziel bleibt, FRONTLINERS auch auf weniger leistungsstarken PCs möglichst flüssig spielbar zu machen.\r\n\r\n🖥️ Neues HUD, Deploy-Karte und Audio\r\n\r\nZum Abschluss haben wir auch die Benutzeroberfläche umfangreich überarbeitet.\r\n\r\nDas HUD wurde modernisiert und eine interaktive Deploy-Karte integriert, die eine bessere Übersicht über das Schlachtfeld bietet.\r\n\r\nAußerdem haben wir große Teile des Spiels mit passenden Sounds ausgestattet, darunter die unterschiedlichen Fahrzeuge.\r\n\r\n---\r\n\r\n🚀 Wie geht es weiter?\r\n\r\nFRONTLINERS hat in den vergangenen Wochen einen großen Entwicklungsschritt gemacht. Doch wir sind noch lange nicht fertig!\r\n\r\nIn den kommenden Updates wollen wir unter anderem das Fahrzeug-Customizing erweitern, zusätzliche Spielmodi integrieren und weiter an Performance, Balancing und der Zerstörung der Spielwelt arbeiten.\r\n\r\nUnser Ziel bleibt ein dynamischer Multiplayer-Shooter, bei dem sich jedes Match anders anfühlt.\r\n\r\nWir freuen uns darauf, euch schon bald weitere Einblicke in die Entwicklung von FRONTLINERS zu geben!", "frontliners-devlog-2": "Die Entwicklung von FRONTLINERS geht weiter! In den vergangenen Tagen haben wir uns besonders intensiv mit der technischen Grundlage unseres Shooters beschäftigt.\r\n\r\nVor allem unser Zerstörungssystem hat uns vor einige Herausforderungen gestellt. Gleichzeitig wurde an neuen Maps, der Fahrzeugsteuerung und zahlreichen Gameplay-Verbesserungen gearbeitet.\r\n\r\nHier gibt es einen Einblick in unseren aktuellen Entwicklungsstand!\r\n\r\n💥 Zerstörung 2.0 – Mehr als nur explodierende Gebäude\r\n\r\nUnser bisher größter Schwerpunkt ist weiterhin die Zerstörung der Spielwelt.\r\n\r\nDabei orientieren wir uns an Spielen wie THE FINALS, in denen Gebäude nicht einfach nur auseinanderfliegen, sondern physikalisch nachvollziehbar auf Beschädigungen reagieren.\r\n\r\nIn unseren bisherigen Tests konnten wir bereits deutliche Performance-Verbesserungen erzielen. Gleichzeitig haben wir festgestellt, dass unser bisheriger technischer Ansatz langfristig nicht unseren Qualitätsansprüchen entspricht.\r\n\r\nDeshalb haben wir uns entschieden, das System grundlegend neu aufzubauen.\r\n\r\nUnser Ziel für das neue Zerstörungssystem:\r\n\r\n- Präzise Beschädigungen, beispielsweise einzelne Löcher durch Raketeneinschläge\r\n- Gebäude, deren tragende Strukturen tatsächlich eine Rolle spielen\r\n- Realistisch einstürzende Gebäudeteile statt zufälliger Explosionen\r\n- Trümmer, die als Deckung dienen und das Schlachtfeld verändern\r\n- Deutlich bessere Performance auch bei umfangreicher Zerstörung\r\n- Einheitliche, synchronisierte Zerstörung im Multiplayer\r\n\r\nDabei arbeiten wir an einer Kombination aus eigener Gebäudestatik, vorbereiteten Bruchstrukturen und optimierter Physiksimulation.\r\n\r\nDas Ganze ist technisch anspruchsvoll, aber für uns eines der wichtigsten Systeme von FRONTLINERS.\r\n\r\n🗺️ Neue Maps und verbessertes Leveldesign\r\n\r\nAuch bei unseren Schlachtfeldern geht es voran!\r\n\r\nMit einer weiteren Map, die intern unter anderem als Apocalypse geführt wird, testen wir neue Umgebungen und unterschiedliche Geländeaufbauten.\r\n\r\nDabei beschäftigen wir uns besonders mit der Spielbarkeit der Karten: Laufwege, Deckungsmöglichkeiten, Fahrzeugbewegungen und die Verteilung wichtiger Kampfbereiche.\r\n\r\nZusätzlich arbeiten wir an Verbesserungen der Geländekollisionen und der Performance größerer Umgebungen.\r\n\r\nLangfristig möchten wir unterschiedliche Schauplätze bieten, damit sich FRONTLINERS nicht ausschließlich auf Wüstenlandschaften beschränkt.\r\n\r\n🚁 Helikopter und Bewegungsmechaniken\r\n\r\nAuch die Fahrzeugsteuerung bekommt weitere Aufmerksamkeit.\r\n\r\nInsbesondere unsere Helikopter sollen sich deutlich natürlicher steuern lassen. Statt einer stark automatisierten Flugbewegung möchten wir ein Fluggefühl erreichen, bei dem Neigung, Geschwindigkeit und Steuerbewegungen besser zusammenspielen.\r\n\r\nParallel dazu überarbeiten wir verschiedene Bewegungsmechaniken unserer Soldaten.\r\n\r\nDazu gehört unter anderem das Vaulting-System, mit dem Hindernisse zuverlässig überwunden werden sollen, ohne dass normale Treppen oder kleinere Höhenunterschiede zu ungewollten Animationen führen.\r\n\r\n🌐 Multiplayer und Server-Performance\r\n\r\nEin weiteres großes Thema ist die Multiplayer-Architektur.\r\n\r\nGerade bei großflächiger Zerstörung, zahlreichen Bots und Fahrzeugen muss sichergestellt werden, dass alle Spieler einen konsistenten Spielzustand erleben.\r\n\r\nDafür arbeiten wir an einer effizienteren Aufteilung zwischen Server und Clients.\r\n\r\nUnser Ziel ist es, dass der Server wichtige Gameplay-Ereignisse und physikalisch relevante Zustände kontrolliert, während die Clients weniger wichtige Effekte lokal darstellen können.\r\n\r\nDadurch möchten wir sowohl die Netzwerkbelastung als auch die benötigte Rechenleistung reduzieren.\r\n\r\n🔧 Bugfixes, Tests und Optimierungen\r\n\r\nNeben den großen Systemen beschäftigen uns natürlich auch zahlreiche kleinere Baustellen.\r\n\r\nDazu zählen unter anderem Fahrzeugkollisionen, Sitzpositionen, Schatten, die Darstellung der Deploy-Karte und verschiedene Probleme bei der Navigation durch unsere Spielwelt.\r\n\r\nBesonders intensiv testen wir aktuell, wie sich Zerstörung, Bots und Fahrzeuge gegenseitig beeinflussen.\r\n\r\nDabei geht es uns nicht einfach darum, möglichst viele Features einzubauen, sondern die vorhandenen Systeme zuverlässig und performant miteinander funktionieren zu lassen.\r\n\r\n---\r\n\r\n🚀 Wie geht es weiter?\r\n\r\nUnser größtes Ziel für die nächsten Entwicklungsschritte ist ein stabiles, überzeugendes und multiplayerfähiges Zerstörungssystem.\r\n\r\nGleichzeitig werden wir weiter an unseren Maps, der Fahrzeugsteuerung, den Bewegungsmechaniken und der allgemeinen Performance arbeiten.\r\n\r\nFRONTLINERS befindet sich weiterhin mitten in der Entwicklung. Nicht jeder Ansatz funktioniert direkt beim ersten Versuch – und manchmal bedeutet Fortschritt auch, ein bestehendes System noch einmal grundlegend zu überdenken.\r\n\r\nGenau das gehört für uns zur Spieleentwicklung dazu.\r\n\r\nWir freuen uns darauf, euch schon bald weitere Ergebnisse zeigen zu können!\r\n\r\n– Das PLANIGAMES Entwicklerteam"};

/* Devlog-Text: Absätze, Listen, **fett**, Emoji-Zeilen werden zu Zwischenüberschriften */
function prose(src) {
  let out = "", para = [], list = [];
  const fp = () => { if (para.length) { out += `<p>${inl(para.join(" "))}</p>`; para = []; } };
  const fl = () => { if (list.length) { out += `<ul>${list.map((x) => `<li>${inl(x)}</li>`).join("")}</ul>`; list = []; } };
  for (const raw of String(src || "").replace(/\r/g, "").split("\n")) {
    const l = raw.trim();
    if (!l) { fp(); fl(); continue; }
    if (/^-{3,}$/.test(l)) { fp(); fl(); out += "<hr>"; continue; }
    if (/^#{1,3}\s/.test(l)) { fp(); fl(); out += `<h2>${inl(l.replace(/^#+\s*/, ""))}</h2>`; continue; }
    const em = l.match(/^((?:\p{Extended_Pictographic}|️|‍)+)\s*(.+)$/u);
    if (em && l.length < 90 && !/[.!:]$/.test(l)) { fp(); fl(); out += `<h2><span class="emo">${em[1]}</span>${inl(em[2])}</h2>`; continue; }
    if (/^[-*]\s+/.test(l)) { fp(); list.push(l.replace(/^[-*]\s+/, "")); continue; }
    fl(); para.push(l);
  }
  fp(); fl();
  return out;
}

    case "download": return `<section class="sec"><div class="wrap rt rv"><div><h2 class="h2">${esc(b.h)}</h2></div><div><p class="lead">${esc(b.text)}</p><div style="margin-top:22px">${b.builds.map(([n, m]) => `<div class="build"><span class="emo">🪟</span><span><b>${esc(n)}</b><small>${esc(m)}</small></span><button type="button" aria-label="${esc(n)} herunterladen" data-fakedl>${ic("dl")}</button></div>`).join("")}</div></div></div></section>`;
    case "features": return `<section class="sec"><div class="wrap"><div class="sec-h"><h2 class="h2">${esc(b.h)}</h2></div><div class="feats" style="--fc:${Math.min(4, b.items.length)}">${b.items.map(([e, t, d]) => `<div class="val rv"><span class="emo">${e}</span><h3 class="h3">${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}</div></div></section>`;
    case "stats": return `<section class="sec"><div class="wrap"><div class="stats">${b.items.map(([v, l]) => `<div class="stat rv"><b class="grad">${esc(v)}</b><span class="badge">${esc(l)}</span></div>`).join("")}</div></div></section>`;
    case "gallery": return `<section class="sec"><div class="wrap"><div class="sec-h"><h2 class="h2">${esc(b.h)}</h2></div><div class="gal">${b.items.map((s) => `<figure class="rv"><img src="${M(s)}" alt="" loading="lazy"></figure>`).join("")}</div></div></section>`;
    case "lore": return `<section class="sec"><div class="wrap"><a class="lore rv" href="#" onclick="return false"><img src="${M(b.img)}" alt="" loading="lazy" style="object-position:${focus(b.img)}"><span><h2 class="h2">${esc(b.h)}</h2><p>${esc(b.text)}</p><span class="btn btn-p btn-s">${esc(b.label)} ${ic("arrow")}</span></span></a></div></section>`;
    case "faq": return `<section class="sec"><div class="wrap"><div class="sec-h"><h2 class="h2">${esc(b.h)}</h2></div><div class="faq">${b.items.map(([q, a]) => `<details><summary>${esc(q)}${ic("plus")}</summary><div class="a"><p>${inl(a)}</p></div></details>`).join("")}</div></div></section>`;
    case "join": return `<section class="sec" id="s-wl"><div class="wrap"><div class="card cta2 rv"><div><h2 class="h2">${esc(b.wl.h)}</h2><p class="lead" style="margin-top:10px">${esc(b.wl.intro)}</p>${nlForm("wl-" + g.slug, "Eintragen", b.wl.ok)}</div><div class="wl" style="text-align:left;background:radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 65%)"><h2 class="h2">${esc(b.cta.h)}</h2><p style="margin:12px 0 22px">${esc(b.cta.text)}</p><a class="btn btn-p" href="#" onclick="return false">${esc(b.cta.label)} ${ic("arrow")}</a></div></div></div></section>`;
    case "posts": return posts.length ? `<section class="sec"><div class="wrap"><div class="sec-h"><h2 class="h2">Patch Notes</h2><a class="more dim" href="#devlog">Alle ${ic("arrow")}</a></div><div class="plist">${posts.map(prow).join("")}</div></div></section>` : "";
  }
  return "";
}

/* =================== Verhalten =================== */
const app = document.getElementById("app"), hd = document.getElementById("hd"), pv = document.getElementById("pv");
const mn = document.getElementById("mn"), burger = document.querySelector("[data-burger]");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let io = null, pendingSec = null, parEl = null;

function setMenu(open) { mn.classList.toggle("open", open); mn.setAttribute("aria-hidden", String(!open)); burger.setAttribute("aria-expanded", String(open)); document.body.classList.toggle("lock", open); }
function marks() { document.querySelectorAll("[data-mark]").forEach((el) => { if (!el.firstChild) { const s = +el.dataset.mark; el.innerHTML = logo("/media/logo-6.png", "", s * s); } }); }
function reveals() {
  if (io) io.disconnect();
  const els = document.querySelectorAll(".rv");
  if (reduced || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
  io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { rootMargin: "0px 0px -6% 0px" });
  els.forEach((e) => io.observe(e));
}
function par() { parEl = reduced ? null : app.querySelector("[data-par]"); parTick(); }
function parTick() { if (parEl && scrollY < innerHeight * 1.2) parEl.style.transform = `translate3d(0,${(scrollY * 0.2).toFixed(1)}px,0)`; }
function wire() {
  app.querySelectorAll("form[data-fake]").forEach((f) => f.addEventListener("submit", (e) => { e.preventDefault(); const ok = f.nextElementSibling; if (ok && ok.classList.contains("ok")) ok.hidden = false; f.reset(); }));
  app.querySelectorAll("[data-vote]").forEach((b) => b.addEventListener("click", () => { const on = b.classList.toggle("on"); b.setAttribute("aria-pressed", String(on)); b.querySelector("span").textContent = +b.dataset.vote + (on ? 1 : 0); }));
  const fl = app.querySelector("[data-filters]");
  if (fl) fl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    fl.querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
    let n = 0;
    app.querySelectorAll("[data-posts] .pcard").forEach((r) => { const show = !b.dataset.f || r.dataset.g === b.dataset.f; r.hidden = !show; n += show ? 1 : 0; });
    app.querySelector("[data-posts] .empty").hidden = n > 0;
  });
  app.querySelectorAll("[data-fakedl]").forEach((b) => b.addEventListener("click", () => { b.title = "Im Probedesign ohne Funktion"; b.animate([{ transform: "translateY(0)" }, { transform: "translateY(3px)" }, { transform: "translateY(0)" }], { duration: 300 }); }));
}
const scrollToSec = (sec) => { const t = document.getElementById("s-" + sec); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + scrollY - (sec === "kontakt" ? 0 : 70), behavior: reduced ? "auto" : "smooth" }); };

function route() {
  const k = (location.hash || "").replace(/^#/, "") || "start";
  let view = "home", html;
  if (k === "spiele") { view = "games"; html = viewGames(); }
  else if (G(k)) { view = k; html = viewGame(k); }
  else if (k === "devlog") { view = "devlog"; html = viewDevlog(); }
  else if (P(k)) { view = "post"; html = viewPost(k); }
  else html = viewHome();
  app.innerHTML = html;
  const navKey = view === "games" || G(view) ? "games" : view === "devlog" || view === "post" ? "devlog" : view === "home" ? "studio" : "";
  document.querySelectorAll("[data-nav]").forEach((n) => n.classList.toggle("on", n.dataset.nav === navKey));
  document.querySelectorAll("[data-pv]").forEach((n) => n.classList.toggle("on", n.dataset.pv === view));
  pv.open = false; setMenu(false);
  marks(); wire(); reveals(); par();
  const sec = pendingSec; pendingSec = null;
  if (sec) setTimeout(() => scrollToSec(sec), 60); else window.scrollTo(0, 0);
  hd.classList.toggle("solid", scrollY > 20);
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-sec]"); if (!a) return;
  e.preventDefault();
  const target = a.getAttribute("href").replace(/^#/, ""), cur = (location.hash || "").replace(/^#/, "") || "start";
  setMenu(false);
  if (target !== cur) { pendingSec = a.dataset.sec; location.hash = target; } else scrollToSec(a.dataset.sec);
});
burger.addEventListener("click", () => setMenu(!mn.classList.contains("open")));
mn.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
pv.addEventListener("click", (e) => { if (e.target.closest("a")) pv.open = false; });
addEventListener("keydown", (e) => { if (e.key === "Escape") { setMenu(false); pv.open = false; } });
let rafP = 0;
addEventListener("scroll", () => { hd.classList.toggle("solid", scrollY > 20); if (!rafP) rafP = requestAnimationFrame(() => { rafP = 0; parTick(); }); }, { passive: true });
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
