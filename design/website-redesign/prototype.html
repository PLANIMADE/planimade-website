<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PLANIGAMES Website-Probedesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PLANIGAMES – Probedesign v6
   Neues, ruhig-hochwertiges Design: eine Schrift (Montserrat), moderate Überschriften,
   dunkel mit Studio-Orange, klare Abschnitte, Karten mit Spiel-Logos, sorgfältige Abstände.
   ===================================================================== */
:root{
  color-scheme:dark;
  --bg:#0b0b10; --bg2:#101017; --card:#15151d; --card2:#1b1b25;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --ink:#ffffff; --ink2:#cfcfd8; --ink3:#9c9cab; --ink4:#707080;
  --acc:#ff7d1a; --acc2:#ffa24c; --acc-soft:rgba(255,125,26,.12);
  --max:1200px; --g:24px; --sec:clamp(72px,8vw,112px); --r:18px; --rs:12px;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 24px 50px -28px rgba(0,0,0,.85);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (max-width:560px){:root{--g:18px;--r:16px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink2);font-family:var(--f);font-size:16px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{list-style:none;padding:0}
[hidden]{display:none !important}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:calc(var(--max) + 2 * var(--g));margin:0 auto;padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.sec{padding:var(--sec) 0}
.band{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ---------- Schrift ---------- */
.h1,.h2,.h3{color:var(--ink);font-weight:800;letter-spacing:-.02em;overflow-wrap:break-word}
.h1{font-size:clamp(34px,4.4vw,56px);line-height:1.1}
.h2{font-size:clamp(27px,2.9vw,38px);line-height:1.18}
.h3{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.grad{background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-block;margin-bottom:14px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.lead{font-size:17.5px;line-height:1.7;color:var(--ink2)}
p{color:var(--ink3)}
.txt p + p{margin-top:1em}
.txt b{color:var(--ink);font-weight:600}
.sh{max-width:680px;margin:0 0 40px}
.sh .lead{margin-top:12px}
.sh-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:40px}
.sh-row .lead{margin-top:10px;max-width:620px}

/* ---------- Bedienelemente ---------- */
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:var(--rs);cursor:pointer;font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;transition:transform .25s var(--ease),filter .25s,background .25s,box-shadow .25s}
.btn .ic{width:18px;height:18px;transition:transform .3s var(--ease)}
.btn:hover .ic{transform:translateX(3px)}
.btn-p{background:linear-gradient(135deg,#ff8f33,#ff6a00);color:#fff;box-shadow:0 12px 28px -12px rgba(255,110,0,.8)}
.btn-p:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-s{background:rgba(255,255,255,.06);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.btn-s:hover{background:rgba(255,255,255,.1)}
.btn-s:hover .ic{transform:none}
.btn-sm{min-height:42px;padding:0 18px;font-size:14px}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;color:var(--acc)}
.link .ic{width:17px;height:17px;transition:transform .3s var(--ease)}
a:hover .link .ic,.link:hover .ic{transform:translateX(3px)}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;max-width:100%;padding:0 12px;white-space:nowrap;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:rgba(10,10,15,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dot,var(--acc))}
.chip.paused i{background:transparent;box-shadow:inset 0 0 0 1.5px #c9c9d4}
.chip.hl{background:var(--acc);color:#fff;box-shadow:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line)}
.lg{display:block;position:relative;overflow:hidden;width:calc(var(--w) * var(--k,1));max-width:100%}
.lg img{position:absolute;max-width:none;height:auto}

/* ---------- Kopfzeile ---------- */
.hd{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s}
.hd.solid{background:rgba(11,11,16,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.hd-in{display:flex;align-items:center;gap:32px;height:74px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.wm{font-weight:800;font-size:17px;letter-spacing:.03em;color:#fff}
.wm span{color:var(--acc)}
.nav{display:flex;gap:28px}
.nav a{font-weight:600;font-size:14.5px;color:var(--ink2);transition:color .2s}
.nav a:hover,.nav a.on{color:#fff}
.nav a.on{box-shadow:inset 0 -2px 0 var(--acc);padding-bottom:4px}
.hd-r{display:flex;align-items:center;gap:10px}
.lang{font-size:13px;font-weight:600;color:var(--ink4)} .lang b{color:#fff}
.burger{display:none;position:relative;width:42px;height:42px;margin-right:-8px;border:0;background:none;cursor:pointer}
.burger i{position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:#fff;transition:transform .3s var(--ease),top .3s var(--ease),opacity .2s}
.burger i:nth-child(1){top:14px} .burger i:nth-child(2){top:20px} .burger i:nth-child(3){top:26px}
.burger[aria-expanded="true"] i:nth-child(1){top:20px;transform:rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){top:20px;transform:rotate(-45deg)}
.mn{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;gap:24px;padding:96px var(--g) calc(28px + env(safe-area-inset-bottom,0px));background:rgba(11,11,16,.98);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.mn.open{opacity:1;visibility:visible;transition:opacity .25s}
.mn nav{display:grid}
.mn nav a{padding:16px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:22px;color:#fff}
.mn .row{margin-top:auto}
.mn .row .btn{flex:1 1 auto}

/* ---------- Startseite: Kopfbereich ---------- */
.hero{position:relative;display:flex;align-items:center;min-height:clamp(560px,86vh,780px);padding:120px 0 80px;overflow:hidden;isolation:isolate}
.hero > img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:65% 50%;animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.06)}to{transform:none}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,11,16,.95) 0%,rgba(11,11,16,.78) 40%,rgba(11,11,16,.3) 75%,rgba(11,11,16,.2) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(11,11,16,0) 35%),linear-gradient(180deg,rgba(11,11,16,.65),rgba(11,11,16,0) 25%)}
.hero-in{max-width:640px}
.hero .chip{margin-bottom:24px}
.hero .lead{margin:20px 0 34px;max-width:560px}

/* Laufband (dezent) */
.tick{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);padding:16px 0}
.tick-in{display:inline-flex;align-items:center;gap:30px;padding-left:30px;animation:tick 55s linear infinite;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink4)}
.tick-in i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- Spielkarten ---------- */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.gcard{display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .35s var(--ease),box-shadow .35s}
.gcard:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--line2),var(--shadow)}
.gimg{position:relative;aspect-ratio:16/11;overflow:hidden;background:#111}
.games.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.games.two .gimg{aspect-ratio:16/9}
.gimg > img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.gcard:hover .gimg > img{transform:scale(1.05)}
.gimg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,16,.92) 0%,rgba(11,11,16,.35) 42%,rgba(11,11,16,0) 70%)}
.gimg .chips{position:absolute;z-index:1;left:14px;right:14px;top:14px;display:flex;flex-wrap:wrap;gap:8px}
.gimg .lg{position:absolute !important;z-index:1;left:20px;bottom:18px;max-width:calc(100% - 40px)}
.gbody{display:flex;flex-direction:column;gap:10px;flex:1;padding:20px 22px 22px}
.gmeta{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4)}
.gbody p{font-size:15px;line-height:1.6}
.gbody .link{margin-top:auto;padding-top:6px}
.demos{display:flex;align-items:center;gap:20px;margin-top:24px;padding:20px 24px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s}
.demos:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.icn{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:14px;background:var(--acc-soft);color:var(--acc);font-size:22px}
.icn .ic{width:22px;height:22px}
.icn.emo{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line)}
.demos > span:nth-child(2){flex:1}
.demos b{display:block;color:#fff;font-weight:700}
.demos small{font-size:14px;color:var(--ink3)}

/* ---------- Studio ---------- */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:center}
.about .txt{margin-top:20px;font-size:16.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:32px}
.stats div{padding:18px 16px;border-radius:var(--rs);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.stats b{display:block;font-size:28px;font-weight:800;line-height:1.1;color:#fff}
.stats span{font-size:13px;color:var(--ink3)}
.collage{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:14px;aspect-ratio:1.1}
.collage figure{overflow:hidden;border-radius:var(--r);background:#111}
.collage figure:first-child{grid-row:1/3}
.collage img{width:100%;height:100%;object-fit:cover}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.val{padding:26px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s,transform .35s var(--ease)}
.val:hover{box-shadow:inset 0 0 0 1px var(--line2);transform:translateY(-3px)}
.val .icn{margin-bottom:18px}
.val .h3{margin-bottom:8px}
.val p{font-size:15px;line-height:1.6}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.tm{overflow:hidden;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.tm figure{aspect-ratio:6/5;overflow:hidden;background:#111}
.tm img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.tm:hover img{transform:scale(1.04)}
.tm-b{padding:20px 22px 22px}
.tm .role{display:block;margin:4px 0 12px;font-size:13px;font-weight:600;color:var(--acc)}
.tm .q{font-style:italic;color:var(--ink2);font-size:15px}
.tm .loc{margin-top:8px;font-size:13px;color:var(--ink4)}

/* ---------- Devlog-Karten ---------- */
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.pcard{display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .35s var(--ease),box-shadow .35s}
.pcard:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--line2),var(--shadow)}
.pcard figure{position:relative;aspect-ratio:16/10;overflow:hidden;background:#111}
.pcard figure > img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.pcard:hover figure > img{transform:scale(1.05)}
.pcard .ph-img{filter:brightness(.5) saturate(.85)}
.pcard .card-logo{position:absolute !important;left:50%;top:50%;transform:translate(-50%,-50%)}
.pcard figure .chip{position:absolute;left:14px;top:14px}
.pbody{display:flex;flex-direction:column;gap:8px;flex:1;padding:20px 22px 22px}
.pbody time{font-size:13px;color:var(--ink4);font-weight:600}
.pbody .h3{font-size:18px}
.pbody p{font-size:15px;line-height:1.6}
.pbody .link{margin-top:auto;padding-top:6px}
.pcard.feat{grid-column:1/-1;flex-direction:row}
.pcard.feat figure{flex:0 0 58%;aspect-ratio:16/9}
.pcard.feat .pbody{justify-content:center;gap:10px;padding:32px 36px}
.pcard.feat .h3{font-size:24px}
.pcard.feat .link{margin-top:6px}
.more{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:28px;border-radius:var(--r);background:radial-gradient(120% 90% at 0% 0%,rgba(255,125,26,.1),transparent 60%),var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s,transform .35s var(--ease)}
.more:hover{box-shadow:inset 0 0 0 1px var(--line2);transform:translateY(-4px)}
.more .icn{margin-bottom:6px}
.more p{font-size:15px}

/* ---------- Anmelde-Band ---------- */
.cta{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;padding:clamp(28px,5vw,64px);border-radius:24px}
.cta > img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,11,16,.94) 0%,rgba(11,11,16,.82) 55%,rgba(11,11,16,.55) 100%)}
.cta .h2{margin-bottom:12px}
.cta .lead{max-width:520px}
.nl{display:flex;gap:10px;margin-top:26px;max-width:520px}
.nl input,.idea input{flex:1;min-width:0;height:52px;padding:0 18px;border:0;border-radius:var(--rs);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line2);outline:0;font-size:15.5px;transition:box-shadow .2s,background .2s}
.nl input:focus,.idea input:focus{box-shadow:inset 0 0 0 1.5px var(--acc);background:rgba(255,255,255,.09)}
.nl input::placeholder,.idea input::placeholder{color:var(--ink4)}
.ok{margin-top:12px;color:#fff;font-weight:600}
.socials{justify-self:end;display:grid;gap:12px;min-width:240px}
.socials p{font-size:14px;color:var(--ink2);margin-bottom:2px}
.socials .btn{justify-content:flex-start}

/* ---------- Footer ---------- */
.ft{background:#08080c;border-top:1px solid var(--line);padding-top:64px}
.ft-top{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:40px;padding-bottom:48px}
.ft-brand p{max-width:320px;margin-top:16px;font-size:14.5px}
.ft-col b{display:block;margin-bottom:16px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.ft-col ul{display:grid;gap:10px}
.ft-col a{font-size:14.5px;color:var(--ink3);transition:color .2s}
.ft-col a:hover{color:#fff}
.ft-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:13px;color:var(--ink4)}
.ft-bot span{display:flex;flex-wrap:wrap;gap:8px 22px}
.ft-bot a:hover{color:#fff}

/* ---------- Unterseiten ---------- */
.pg{padding:clamp(120px,15vh,156px) 0 clamp(40px,5vw,64px);background:radial-gradient(70% 120% at 15% 0%,rgba(255,125,26,.1),transparent 60%)}
.pg .lead{max-width:620px;margin-top:16px}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:13.5px;font-weight:600;color:var(--ink3)}
.gh .crumb{color:var(--ink2);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.crumb a:hover{color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.filters button{height:38px;padding:0 16px;border:0;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink2);transition:background .2s,color .2s}
.filters button:hover{background:rgba(255,255,255,.09);color:#fff}
.filters button.on{background:var(--acc);color:#fff;box-shadow:none}
.empty{padding:32px;text-align:center;color:var(--ink4)}
.builds{display:grid;gap:10px}
.build{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--rs);background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line)}
.build .icn{width:42px;height:42px;font-size:18px}
.build b{display:block;color:#fff;font-weight:700;font-size:15px}
.build small{font-size:13px;color:var(--ink4)}
.build button{margin-left:auto;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.06);cursor:pointer;color:#fff;transition:background .2s}
.build button:hover{background:var(--acc)}
.build button .ic{width:18px;height:18px}

/* ---------- Spielseite ---------- */
.gh{position:relative;display:flex;align-items:flex-end;min-height:clamp(520px,72vh,640px);padding:120px 0 56px;overflow:hidden;isolation:isolate}
.gh > img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out both}
.gh::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 0%,rgba(11,11,16,.7) 38%,rgba(11,11,16,.2) 75%,rgba(11,11,16,.55) 100%),linear-gradient(90deg,rgba(11,11,16,.7),rgba(11,11,16,0) 70%)}
.gh .lg{margin:18px 0 16px}
.gh .tag{font-size:clamp(17px,1.6vw,20px);color:var(--ink2);max-width:600px}
.gh .row{margin-top:28px}
.ov{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
.ov .txt{margin-top:20px;font-size:16.5px}
.facts{padding:24px}
.facts h3{margin-bottom:14px}
.facts dl{display:grid}
.facts dl div{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.facts dl div:first-child{border-top:0}
.facts dt{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:10px;background:var(--acc-soft);color:var(--acc)}
.facts dt .ic{width:18px;height:18px}
.facts dd small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4)}
.facts dd span{color:#fff;font-weight:600;font-size:15px}
.facts .build{margin-top:16px}
.vids{display:grid;gap:24px}
.vids.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.bento{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;aspect-ratio:32/9}

.bento figure{position:relative;overflow:hidden;min-height:0;border-radius:var(--rs);background:#111}

.vid{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;border-radius:var(--r);background:#111;box-shadow:inset 0 0 0 1px var(--line)}

.play{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#ff8f33,#ff6a00);color:#fff;box-shadow:0 12px 30px -10px rgba(255,110,0,.8);transition:transform .3s var(--ease)}

.vcap{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;gap:12px;font-weight:700;color:#fff;font-size:15px;text-shadow:0 1px 10px rgba(0,0,0,.6)}

.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}

.tl{position:relative;display:grid;gap:4px}

.tl .dotc .ic{width:16px;height:16px}
.tl .done .dotc{background:var(--acc);box-shadow:none;color:#fff}

.mit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:stretch}

.vote .ic{width:14px;height:14px}

const MEDIA = new URLSearchParams(location.search).get("media") || "https://planigames.com";
const M = (p) => { if (!p) return ""; const k = p.split("#")[0]; if (MEDIA_MAP) return MEDIA_MAP[k] || ""; return /^https?:/.test(k) ? k : MEDIA + k; };
const focus = (p) => { const m = String(p || "").match(/#focus=(\d+),(\d+)/); return m ? m[1] + "% " + m[2] + "%" : "50% 50%"; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

const BOX = {

const BODIES = {"willkommen-im-devlog": "Hallo und herzlich willkommen! 👋\r\n\r\nAb heute gibt es bei **PLANIGAMES** ein offenes Entwicklungstagebuch. Hier erfährst du als Erste*r, woran wir gerade basteln — vom kleinsten Bugfix bis zum großen Feature.\r\n\r\n## Was dich erwartet\r\n\r\n- Regelmäßige **Devlog-Einträge** zu Wobbly Wizards\r\n- Detaillierte **Patch Notes** zu jedem Build\r\n- Blicke hinter die Kulissen: Konzepte, Prototypen, Fehlschläge\r\n\r\nBleib dran — die Magie fängt gerade erst an. 🪄", "wobbly-wizards-ist-erstmal-pausiert": "Aufgrund der Entwicklung an Fall of Kings und WARCATS haben wir unsere Ressourcen und unser Team fürs erste von Wobbly Wizards abgezogen. Aber Wobbly Wizards wird nicht komplett vergessen, freut euch auf zukünftige Updates zum Game!", "frontliners-devlog-1": "Zerstörbare Gebäude, dynamisches Wetter, neue Fahrzeuge und vieles mehr!\r\n\r\nIn den vergangenen Wochen hat sich bei FRONTLINERS einiges getan! Wir haben zahlreiche neue Features integriert, bestehende Systeme überarbeitet und intensiv an der Performance sowie am Gameplay gearbeitet.\r\n\r\nVon einer weitgehend zerstörbaren Spielwelt über neun unterschiedliche Fahrzeuge bis hin zu neuen Spielmodi und umfangreichen Anpassungsmöglichkeiten – hier erfahrt ihr, was sich verändert hat!\r\n\r\n💥 Zerstörbare Spielwelt\r\n\r\nEines unserer bisher größten Features ist die Zerstörung kompletter Gebäude!\r\n\r\nGroße Teile der Spielwelt sind mittlerweile zerstörbar. Dadurch kann sich das Schlachtfeld während einer laufenden Runde erheblich verändern. Gebäude, die zunächst als Deckung dienen, können vollständig zerstört werden und neue taktische Möglichkeiten eröffnen.\r\n\r\n🌪️ Dynamisches Wetter\r\n\r\nMit unserem neuen Wettersystem kann sich das Wetter jetzt auch während eines Matches verändern.\r\n\r\nSo können beispielsweise plötzlich Sandstürme aufziehen, die die Sichtverhältnisse beeinflussen und für völlig neue Kampfsituationen sorgen.\r\n\r\n🚁 Neun Fahrzeuge und Fahrzeug-Customizing\r\n\r\nMittlerweile haben wir neun unterschiedliche Fahrzeuge integriert, die jeweils eigene Stärken und Einsatzmöglichkeiten besitzen.\r\n\r\nZusätzlich verfügen Fahrzeuge jetzt über passende Sounds und freischaltbare Tarnungen.\r\n\r\nFür zukünftige Updates planen wir außerdem ein umfangreicheres Fahrzeug-Customizing, mit dem sich beispielsweise auch unterschiedliche Bordwaffen ausrüsten lassen.\r\n\r\n🎮 Zahlreiche neue Spielmodi\r\n\r\nAuch bei den Spielmodi haben wir ordentlich nachgelegt. Aktuell sind folgende Modi integriert:\r\n\r\n- Hot Zone\r\n- Eroberung\r\n- Team Deathmatch (TDM)\r\n- Deathmatch (FFA)\r\n- 1v1, 2v2, 3v3 und 4v4\r\n- Waffenspiel\r\n- Search and Destroy\r\n\r\nWeitere Spielmodi sind bereits geplant!\r\n\r\n🔫 Loadouts, Inventar und Customizing\r\n\r\nUnser Loadout-Editor wurde vollständig überarbeitet und optisch an das restliche Spiel angepasst.\r\n\r\nAußerdem haben wir ein funktionierendes Inventarsystem integriert und zahlreiche neue Anpassungsmöglichkeiten hinzugefügt.\r\n\r\nDazu gehören unter anderem Waffen-, Soldaten- und Fahrzeugtarnungen, die freigeschaltet und ausgerüstet werden können.\r\n\r\n🏆 Karriere, Challenges und Ingame-Shop\r\n\r\nMit dem neuen Karrieresystem und zahlreichen Challenges gibt es jetzt zusätzliche Fortschrittsmöglichkeiten.\r\n\r\nVerdientes Ingame-Geld lässt sich außerdem im neuen Shop ausgeben, um kosmetische Inhalte und Loot-Kisten freizuschalten.\r\n\r\nDie Kisten können verschiedene Belohnungen enthalten, darunter XP, Ingame-Geld, Tarnungen, Calling Cards und Spielertitel.\r\n\r\n🤖 Verbesserte Bots und Gameplay-Balancing\r\n\r\nWir haben intensiv an unserer Bot-KI gearbeitet, damit sich computergesteuerte Soldaten intelligenter verhalten.\r\n\r\nZusätzlich wurden zahlreiche Balancing-Anpassungen vorgenommen, um Waffen, Fahrzeuge und das allgemeine Gameplay besser aufeinander abzustimmen.\r\n\r\n⚡ Performance, DLSS und FSR\r\n\r\nAuch technisch hat sich einiges getan!\r\n\r\nMit der Integration von NVIDIA DLSS und AMD FSR stehen neue Möglichkeiten zur Performance-Optimierung zur Verfügung.\r\n\r\nDarüber hinaus haben wir zahlreiche weitere Optimierungen vorgenommen. Unser Ziel bleibt, FRONTLINERS auch auf weniger leistungsstarken PCs möglichst flüssig spielbar zu machen.\r\n\r\n🖥️ Neues HUD, Deploy-Karte und Audio\r\n\r\nZum Abschluss haben wir auch die Benutzeroberfläche umfangreich überarbeitet.\r\n\r\nDas HUD wurde modernisiert und eine interaktive Deploy-Karte integriert, die eine bessere Übersicht über das Schlachtfeld bietet.\r\n\r\nAußerdem haben wir große Teile des Spiels mit passenden Sounds ausgestattet, darunter die unterschiedlichen Fahrzeuge.\r\n\r\n---\r\n\r\n🚀 Wie geht es weiter?\r\n\r\nFRONTLINERS hat in den vergangenen Wochen einen großen Entwicklungsschritt gemacht. Doch wir sind noch lange nicht fertig!\r\n\r\nIn den kommenden Updates wollen wir unter anderem das Fahrzeug-Customizing erweitern, zusätzliche Spielmodi integrieren und weiter an Performance, Balancing und der Zerstörung der Spielwelt arbeiten.\r\n\r\nUnser Ziel bleibt ein dynamischer Multiplayer-Shooter, bei dem sich jedes Match anders anfühlt.\r\n\r\nWir freuen uns darauf, euch schon bald weitere Einblicke in die Entwicklung von FRONTLINERS zu geben!", "frontliners-devlog-2": "Die Entwicklung von FRONTLINERS geht weiter! In den vergangenen Tagen haben wir uns besonders intensiv mit der technischen Grundlage unseres Shooters beschäftigt.\r\n\r\nVor allem unser Zerstörungssystem hat uns vor einige Herausforderungen gestellt. Gleichzeitig wurde an neuen Maps, der Fahrzeugsteuerung und zahlreichen Gameplay-Verbesserungen gearbeitet.\r\n\r\nHier gibt es einen Einblick in unseren aktuellen Entwicklungsstand!\r\n\r\n💥 Zerstörung 2.0 – Mehr als nur explodierende Gebäude\r\n\r\nUnser bisher größter Schwerpunkt ist weiterhin die Zerstörung der Spielwelt.\r\n\r\nDabei orientieren wir uns an Spielen wie THE FINALS, in denen Gebäude nicht einfach nur auseinanderfliegen, sondern physikalisch nachvollziehbar auf Beschädigungen reagieren.\r\n\r\nIn unseren bisherigen Tests konnten wir bereits deutliche Performance-Verbesserungen erzielen. Gleichzeitig haben wir festgestellt, dass unser bisheriger technischer Ansatz langfristig nicht unseren Qualitätsansprüchen entspricht.\r\n\r\nDeshalb haben wir uns entschieden, das System grundlegend neu aufzubauen.\r\n\r\nUnser Ziel für das neue Zerstörungssystem:\r\n\r\n- Präzise Beschädigungen, beispielsweise einzelne Löcher durch Raketeneinschläge\r\n- Gebäude, deren tragende Strukturen tatsächlich eine Rolle spielen\r\n- Realistisch einstürzende Gebäudeteile statt zufälliger Explosionen\r\n- Trümmer, die als Deckung dienen und das Schlachtfeld verändern\r\n- Deutlich bessere Performance auch bei umfangreicher Zerstörung\r\n- Einheitliche, synchronisierte Zerstörung im Multiplayer\r\n\r\nDabei arbeiten wir an einer Kombination aus eigener Gebäudestatik, vorbereiteten Bruchstrukturen und optimierter Physiksimulation.\r\n\r\nDas Ganze ist technisch anspruchsvoll, aber für uns eines der wichtigsten Systeme von FRONTLINERS.\r\n\r\n🗺️ Neue Maps und verbessertes Leveldesign\r\n\r\nAuch bei unseren Schlachtfeldern geht es voran!\r\n\r\nMit einer weiteren Map, die intern unter anderem als Apocalypse geführt wird, testen wir neue Umgebungen und unterschiedliche Geländeaufbauten.\r\n\r\nDabei beschäftigen wir uns besonders mit der Spielbarkeit der Karten: Laufwege, Deckungsmöglichkeiten, Fahrzeugbewegungen und die Verteilung wichtiger Kampfbereiche.\r\n\r\nZusätzlich arbeiten wir an Verbesserungen der Geländekollisionen und der Performance größerer Umgebungen.\r\n\r\nLangfristig möchten wir unterschiedliche Schauplätze bieten, damit sich FRONTLINERS nicht ausschließlich auf Wüstenlandschaften beschränkt.\r\n\r\n🚁 Helikopter und Bewegungsmechaniken\r\n\r\nAuch die Fahrzeugsteuerung bekommt weitere Aufmerksamkeit.\r\n\r\nInsbesondere unsere Helikopter sollen sich deutlich natürlicher steuern lassen. Statt einer stark automatisierten Flugbewegung möchten wir ein Fluggefühl erreichen, bei dem Neigung, Geschwindigkeit und Steuerbewegungen besser zusammenspielen.\r\n\r\nParallel dazu überarbeiten wir verschiedene Bewegungsmechaniken unserer Soldaten.\r\n\r\nDazu gehört unter anderem das Vaulting-System, mit dem Hindernisse zuverlässig überwunden werden sollen, ohne dass normale Treppen oder kleinere Höhenunterschiede zu ungewollten Animationen führen.\r\n\r\n🌐 Multiplayer und Server-Performance\r\n\r\nEin weiteres großes Thema ist die Multiplayer-Architektur.\r\n\r\nGerade bei großflächiger Zerstörung, zahlreichen Bots und Fahrzeugen muss sichergestellt werden, dass alle Spieler einen konsistenten Spielzustand erleben.\r\n\r\nDafür arbeiten wir an einer effizienteren Aufteilung zwischen Server und Clients.\r\n\r\nUnser Ziel ist es, dass der Server wichtige Gameplay-Ereignisse und physikalisch relevante Zustände kontrolliert, während die Clients weniger wichtige Effekte lokal darstellen können.\r\n\r\nDadurch möchten wir sowohl die Netzwerkbelastung als auch die benötigte Rechenleistung reduzieren.\r\n\r\n🔧 Bugfixes, Tests und Optimierungen\r\n\r\nNeben den großen Systemen beschäftigen uns natürlich auch zahlreiche kleinere Baustellen.\r\n\r\nDazu zählen unter anderem Fahrzeugkollisionen, Sitzpositionen, Schatten, die Darstellung der Deploy-Karte und verschiedene Probleme bei der Navigation durch unsere Spielwelt.\r\n\r\nBesonders intensiv testen wir aktuell, wie sich Zerstörung, Bots und Fahrzeuge gegenseitig beeinflussen.\r\n\r\nDabei geht es uns nicht einfach darum, möglichst viele Features einzubauen, sondern die vorhandenen Systeme zuverlässig und performant miteinander funktionieren zu lassen.\r\n\r\n---\r\n\r\n🚀 Wie geht es weiter?\r\n\r\nUnser größtes Ziel für die nächsten Entwicklungsschritte ist ein stabiles, überzeugendes und multiplayerfähiges Zerstörungssystem.\r\n\r\nGleichzeitig werden wir weiter an unseren Maps, der Fahrzeugsteuerung, den Bewegungsmechaniken und der allgemeinen Performance arbeiten.\r\n\r\nFRONTLINERS befindet sich weiterhin mitten in der Entwicklung. Nicht jeder Ansatz funktioniert direkt beim ersten Versuch – und manchmal bedeutet Fortschritt auch, ein bestehendes System noch einmal grundlegend zu überdenken.\r\n\r\nGenau das gehört für uns zur Spieleentwicklung dazu.\r\n\r\nWir freuen uns darauf, euch schon bald weitere Ergebnisse zeigen zu können!\r\n\r\n– Das PLANIGAMES Entwicklerteam"};

/* Devlog-Text: Absätze, Listen, **fett**, Emoji-Zeilen werden zu Zwischenüberschriften */
function prose(src) {
  let out = "", para = [], list = [];
  const fp = () => { if (para.length) { out += `<p>${inl(para.join(" "))}</p>`; para = []; } };
  const fl = () => { if (list.length) { out += `<ul>${list.map((x) => `<li>${inl(x)}</li>`).join("")}</ul>`; list = []; } };
  for (const raw of String(src || "").replace(/\r/g, "").split("\n")) {
    const l = raw.trim();
    if (!l) { fp(); fl(); continue; }
    if (/^-{3,}$/.test(l)) { fp(); fl(); out += "<hr>"; continue; }
    if (/^#{1,3}\s/.test(l)) { fp(); fl(); out += `<h2>${inl(l.replace(/^#+\s*/, ""))}</h2>`; continue; }
    const em = l.match(/^((?:\p{Extended_Pictographic}|️|‍)+)\s*(.+)$/u);
    if (em && l.length < 90 && !/[.!:]$/.test(l)) { fp(); fl(); out += `<h2><span class="emo">${em[1]}</span>${inl(em[2])}</h2>`; continue; }
    if (/^[-*]\s+/.test(l)) { fp(); list.push(l.replace(/^[-*]\s+/, "")); continue; }
    fl(); para.push(l);
  }
  fp(); fl();
  return out;
}

/* =================== Verhalten =================== */
const app = document.getElementById("app"), hd = document.getElementById("hd"), pv = document.getElementById("pv");
const mn = document.getElementById("mn"), burger = document.querySelector("[data-burger]");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let io = null, pendingSec = null;

function setMenu(open) { mn.classList.toggle("open", open); mn.setAttribute("aria-hidden", String(!open)); burger.setAttribute("aria-expanded", String(open)); document.body.classList.toggle("lock", open); }
function marks() { document.querySelectorAll("[data-mark]").forEach((el) => { if (!el.firstChild) { const s = +el.dataset.mark; el.innerHTML = logo("/media/logo-6.png", "", s * s); } }); }
function reveals() {
  if (io) io.disconnect();
  const els = document.querySelectorAll(".rv");
  if (reduced || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
  io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { rootMargin: "0px 0px -6% 0px" });
  els.forEach((e) => io.observe(e));
}
function lone() {
  app.querySelectorAll(".games,.posts").forEach((gr) => {
    const cs = [...gr.children].filter((c) => !c.hidden && !c.classList.contains("feat"));
    cs.forEach((c) => c.classList.remove("lone"));
    if (!gr.classList.contains("two") && cs.length % 2) cs[cs.length - 1].classList.add("lone");
  });
}
function wire() {
  app.querySelectorAll("form[data-fake]").forEach((f) => f.addEventListener("submit", (e) => { e.preventDefault(); const ok = f.nextElementSibling; if (ok && ok.classList.contains("ok")) ok.hidden = false; f.reset(); }));
  app.querySelectorAll("[data-vote]").forEach((b) => b.addEventListener("click", () => { const on = b.classList.toggle("on"); b.setAttribute("aria-pressed", String(on)); b.querySelector("span").textContent = +b.dataset.vote + (on ? 1 : 0); }));
  const fl = app.querySelector("[data-filters]");
  if (fl) fl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    fl.querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
    let c = 0;
    app.querySelectorAll("[data-posts] .pcard").forEach((r) => { const show = !b.dataset.f || r.dataset.g === b.dataset.f; r.hidden = !show; c += show ? 1 : 0; });
    app.querySelector(".empty").hidden = c > 0;
    lone();
  });
  app.querySelectorAll("[data-fakedl]").forEach((b) => b.addEventListener("click", () => { b.title = "Im Probedesign ohne Funktion"; b.animate([{ transform: "translateY(0)" }, { transform: "translateY(3px)" }, { transform: "translateY(0)" }], { duration: 300 }); }));
}
const absTop = (el) => { let y = 0; for (; el; el = el.offsetParent) y += el.offsetTop; return y; };   // ohne Einblend-Verschiebung
const scrollToSec = (sec) => { const t = document.getElementById("s-" + sec); if (t) window.scrollTo({ top: absTop(t) - (sec === "kontakt" ? 0 : 40), behavior: reduced ? "auto" : "smooth" }); };

function route() {
  const k = (location.hash || "").replace(/^#/, "") || "start";
  let view = "home", html;
  if (k === "spiele") { view = "games"; html = viewGames(); }
  else if (G(k)) { view = k; html = viewGame(k); }
  else if (k === "devlog") { view = "devlog"; html = viewDevlog(); }
  else if (P(k)) { view = "post"; html = viewPost(k); }
  else html = viewHome();
  app.innerHTML = html;
  const navKey = view === "games" || G(view) ? "games" : view === "devlog" || view === "post" ? "devlog" : "";
  document.querySelectorAll("[data-nav]").forEach((x) => x.classList.toggle("on", x.dataset.nav === navKey));
  document.querySelectorAll("[data-pv]").forEach((x) => x.classList.toggle("on", x.dataset.pv === view));
  pv.open = false; setMenu(false);
  marks(); wire(); lone(); reveals();
  const sec = pendingSec; pendingSec = null;
  if (sec) setTimeout(() => scrollToSec(sec), 60); else window.scrollTo(0, 0);
  hd.classList.toggle("solid", scrollY > 20);
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-sec]"); if (!a) return;
  e.preventDefault();
  const target = a.getAttribute("href").replace(/^#/, ""), cur = (location.hash || "").replace(/^#/, "") || "start";
  setMenu(false);
  if (target !== cur) { pendingSec = a.dataset.sec; location.hash = target; } else scrollToSec(a.dataset.sec);
});
burger.addEventListener("click", () => setMenu(!mn.classList.contains("open")));
mn.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
pv.addEventListener("click", (e) => { if (e.target.closest("a")) pv.open = false; });
addEventListener("keydown", (e) => { if (e.key === "Escape") { setMenu(false); pv.open = false; } });
addEventListener("scroll", () => hd.classList.toggle("solid", scrollY > 20), { passive: true });
addEventListener("hashchange", route);
route();
</script>
