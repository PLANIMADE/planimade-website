backend:
  name: git-gateway
  branch: main

# Sprache des Dashboards
locale: de

# Uploads landen in planigames/media und werden als /media/… verlinkt
# (media_folder ist relativ zum Repo-Root, public_folder relativ zur Website)
media_folder: "planigames/media"
public_folder: "/media"

site_url: /
display_url: /
logo_url: /media/logo.png

# =====================================================================
#  Wiederverwendbare Block-Typen für den Game-"Website-Builder".
#  Jeder Block = ein frei platzierbarer Abschnitt auf der Game-Seite.
#  Reihenfolge per Drag & Drop. Neue Typen hier ergänzen → app.js anpassen.
# =====================================================================

collections:
  # ------------------------------------------------------------------
  - name: "studio"
    label: "Studio-Einstellungen"
    description: "Globale Inhalte: Startseite, Über-uns, Team, Kontakt, Footer."
    files:
      - name: "studio"
        label: "Studio & Startseite"
        file: "planigames/data/studio.json"
        fields:
          - { label: "Studio-Name", name: "name", widget: "string" }
          - { label: "Untertitel / Tagline", name: "tagline", widget: "string", required: false }
          - { label: "Gegründet (Jahr)", name: "founded", widget: "string", required: false }
          - { label: "Hero – Zeile 1", name: "heroLine1", widget: "string", hint: "Große Überschrift, erste Zeile." }
          - { label: "Hero – Zeile 2 (farbig)", name: "heroLine2", widget: "string", hint: "Zweite Zeile, wird im Farbverlauf dargestellt." }
          - { label: "Hero – Einleitungstext", name: "intro", widget: "text" }
          - { label: "Über uns – Überschrift", name: "aboutTitle", widget: "string" }
          - { label: "Über uns – Text", name: "aboutBody", widget: "markdown" }
          - label: "Werte / Stärken (Kacheln)"
            name: "pillars"
            widget: "list"
            label_singular: "Wert"
            summary: "{{fields.title}}"
            fields:
              - { label: "Icon / Emoji", name: "icon", widget: "string", required: false, hint: "z. B. 🪄" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Team"
            name: "team"
            widget: "list"
            required: false
            label_singular: "Person"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Rolle", name: "role", widget: "string", required: false }
              - { label: "Foto", name: "photo", widget: "image", required: false }
              - { label: "Emoji (falls kein Foto)", name: "emoji", widget: "string", required: false, default: "🧙" }
          - { label: "Footer – Kurzbeschreibung", name: "footerNote", widget: "text", required: false }
          - { label: "Kontakt-E-Mail", name: "email", widget: "string" }
          - label: "Social Links"
            name: "socials"
            widget: "list"
            required: false
            label_singular: "Link"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string", hint: "z. B. Discord" }
              - { label: "URL", name: "url", widget: "string" }

  # ------------------------------------------------------------------
  - name: "games"
    label: "Spiele"
    description: "Lege Spiele an und baue ihre Seiten aus frei platzierbaren Blöcken."
    files:
      - name: "games"
        label: "Alle Spiele"
        file: "planigames/data/games.json"
        description: "Reihenfolge per Drag & Drop. Das mit „Hervorgehoben\" markierte Spiel erscheint groß auf der Startseite."
        fields:
          - label: "Spiele"
            name: "games"
            widget: "list"
            label_singular: "Spiel"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Kleinbuchstaben & Bindestriche, z. B. wobbly-wizards. Wird zur Adresse game.html?slug=…" }
              - { label: "Kurzbeschreibung / Tagline", name: "tagline", widget: "text" }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "development"
                options:
                  - { label: "In Entwicklung", value: "development" }
                  - { label: "Angekündigt", value: "announced" }
                  - { label: "Demo verfügbar", value: "demo" }
                  - { label: "Early Access", value: "early" }
                  - { label: "Veröffentlicht", value: "released" }
              - { label: "Akzentfarbe", name: "accent", widget: "string", default: "#a855f7", hint: "Hauptfarbe der Game-Welt, als HEX (z. B. #a855f7)." }
              - { label: "Zweitfarbe", name: "accent2", widget: "string", required: false, default: "#22d3ee", hint: "Zweite HEX-Farbe für Verläufe (z. B. #22d3ee)." }
              - { label: "Hervorgehoben (Startseite)", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Cover-Bild", name: "cover", widget: "image", required: false, hint: "Querformat 16:10. Für Karten & Startseite." }
              - { label: "Logo (transparent)", name: "logo", widget: "image", required: false, hint: "PNG mit Transparenz – wird im Hero statt des Titels gezeigt." }
              - { label: "Wishlist / Store-Link", name: "wishlistUrl", widget: "string", required: false, hint: "z. B. Steam-Seite." }
              - label: "Seiten-Blöcke (Website-Builder)"
                name: "blocks"
                label_singular: "Block"
                widget: "list"
                types:
                  - label: "Hero (Kopfbereich)"
                    name: "hero"
                    widget: "object"
                    summary: "Hero"
                    fields:
                      - { label: "Tagline (überschreibt Standard)", name: "tagline", widget: "text", required: false }
                      - { label: "Hintergrundbild", name: "background", widget: "image", required: false }
                      - { label: "Hintergrund-Video (mp4)", name: "video", widget: "file", required: false }
                      - { label: "Video-Vorschaubild", name: "poster", widget: "image", required: false }
                      - { label: "Button-Text", name: "ctaLabel", widget: "string", required: false, default: "Auf Steam wishlisten" }
                      - { label: "Trailer-Link (Button)", name: "trailerUrl", widget: "string", required: false }
                  - label: "Textabschnitt"
                    name: "richtext"
                    widget: "object"
                    summary: "Text: {{fields.heading}}"
                    fields:
                      - { label: "Kicker (kleine Zeile)", name: "kicker", widget: "string", required: false }
                      - { label: "Überschrift", name: "heading", widget: "string", required: false }
                      - { label: "Text", name: "body", widget: "markdown" }
                  - label: "Feature-Kacheln"
                    name: "features"
                    widget: "object"
                    summary: "Features: {{fields.heading}}"
                    fields:
                      - { label: "Überschrift", name: "heading", widget: "string", required: false }
                      - label: "Kacheln"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.title}}"
                        fields:
                          - { label: "Icon / Emoji", name: "icon", widget: "string", required: false }
                          - { label: "Titel", name: "title", widget: "string" }
                          - { label: "Text", name: "text", widget: "text" }
                  - label: "Bildergalerie"
                    name: "gallery"
                    widget: "object"
                    summary: "Galerie: {{fields.heading}}"
                    fields:
                      - { label: "Überschrift", name: "heading", widget: "string", required: false }
                      - label: "Bilder"
                        name: "images"
                        widget: "list"
                        field: { label: "Bild", name: "image", widget: "image" }
                  - label: "Trailer / Video"
                    name: "trailer"
                    widget: "object"
                    summary: "Trailer: {{fields.heading}}"
                    fields:
                      - { label: "Überschrift", name: "heading", widget: "string", required: false }
                      - { label: "YouTube-Link", name: "youtube", widget: "string", required: false, hint: "Voller YouTube-Link. Alternativ Video-Datei unten." }
                      - { label: "Video-Datei (mp4)", name: "file", widget: "file", required: false }
                      - { label: "Vorschaubild", name: "poster", widget: "image", required: false }
                  - label: "Zitate / Reviews"
                    name: "quotes"
                    widget: "object"
                    summary: "Zitate: {{fields.heading}}"
                    fields:
                      - { label: "Überschrift", name: "heading", widget: "string", required: false }
                      - label: "Zitate"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.author}}"
                        fields:
                          - { label: "Zitat", name: "text", widget: "text" }
                          - { label: "Autor / Quelle", name: "author", widget: "string", required: false }
                          - { label: "Medium / Detail", name: "source", widget: "string", required: false }
                  - label: "Kennzahlen"
                    name: "stats"
                    widget: "object"
                    summary: "Kennzahlen"
                    fields:
                      - label: "Zahlen"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.value}} – {{fields.label}}"
                        fields:
                          - { label: "Wert", name: "value", widget: "string", hint: "z. B. 1–4 oder 2025" }
                          - { label: "Bezeichnung", name: "label", widget: "string" }
                  - label: "Roadmap / Zeitstrahl"
                    name: "roadmap"
                    widget: "object"
                    summary: "Roadmap: {{fields.heading}}"
                    fields:
                      - { label: "Überschrift", name: "heading", widget: "string", required: false }
                      - label: "Meilensteine"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.title}}"
                        fields:
                          - label: "Status"
                            name: "status"
                            widget: "select"
                            default: "planned"
                            options:
                              - { label: "Erledigt", value: "done" }
                              - { label: "In Arbeit", value: "active" }
                              - { label: "Geplant", value: "planned" }
                          - { label: "Zeitpunkt", name: "date", widget: "string", required: false, hint: "z. B. 2025 Q1" }
                          - { label: "Titel", name: "title", widget: "string" }
                          - { label: "Beschreibung", name: "text", widget: "text", required: false }
                  - label: "Call-to-Action (Banner)"
                    name: "cta"
                    widget: "object"
                    summary: "CTA: {{fields.heading}}"
                    fields:
                      - { label: "Überschrift", name: "heading", widget: "string" }
                      - { label: "Text", name: "text", widget: "text", required: false }
                      - { label: "Button-Text", name: "label", widget: "string", default: "Jetzt wishlisten" }
                      - { label: "Button-Link", name: "url", widget: "string", required: false }
                  - label: "Abstand / Leerraum"
                    name: "spacer"
                    widget: "object"
                    summary: "Abstand {{fields.size}}px"
                    fields:
                      - { label: "Höhe (px)", name: "size", widget: "number", default: 48 }

  # ------------------------------------------------------------------
  - name: "patchnotes"
    label: "Devlog & Patch Notes"
    description: "Devlog-Einträge, Ankündigungen und Patchnotes. Pro Spiel zuordenbar."
    files:
      - name: "patchnotes"
        label: "Alle Beiträge"
        file: "planigames/data/patchnotes.json"
        description: "Neueste Beiträge erscheinen automatisch oben. Reihenfolge wird über das Datum bestimmt."
        fields:
          - label: "Beiträge"
            name: "posts"
            widget: "list"
            label_singular: "Beitrag"
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Kleinbuchstaben & Bindestriche, z. B. build-0-3-spruch-kombos." }
              - { label: "Datum", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Spiel (Slug)", name: "game", widget: "string", required: false, hint: "Slug des Spiels, z. B. wobbly-wizards. Leer = allgemeine Studio-News." }
              - { label: "Version", name: "version", widget: "string", required: false, hint: "z. B. 0.3.0 – erscheint als Badge. Leer lassen für reine News." }
              - { label: "Tags", name: "tags", widget: "list", required: false, hint: "z. B. patchnotes, gameplay" }
              - { label: "Titelbild", name: "cover", widget: "image", required: false }
              - { label: "Kurzfassung", name: "excerpt", widget: "text", required: false, hint: "Teaser für die Übersicht." }
              - { label: "Inhalt", name: "body", widget: "markdown" }
