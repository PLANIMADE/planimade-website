; PHP-Einstellungen für die API (all-inkl liest .user.ini bei FastCGI/PHP-FPM aus).
; Falls Uploads trotzdem abbrechen: im KAS unter "Software" > "PHP-Version/Einstellungen"
; die gleichen Werte setzen – die KAS-Einstellung hat Vorrang.

upload_max_filesize = 256M
post_max_size = 260M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
