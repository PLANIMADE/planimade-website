name: Deploy Unreal Academy (GitHub Pages)

# Baut die Lern-App (unreal-academy/) als statische Seite und veröffentlicht sie
# auf GitHub Pages → https://<owner>.github.io/planimade-website/
on:
  push:
    branches: [main]
    paths:
      - "unreal-academy/**"
      - ".github/workflows/deploy-unreal-academy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unreal-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: unreal-academy/package-lock.json
      - run: npm ci
      - name: Build (statischer Export)
        env:
          EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /planimade-website
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: unreal-academy/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
