name: Deploy PLANIGAMES → All-Inkl

# Lädt die Website automatisch per FTPS zu All-Inkl hoch, sobald auf den
# Arbeits-Branch gepusht wird. Der data/-Ordner wird NIE angefasst –
# deine Inhalte, Logins, Mail- & Kontakt-Daten bleiben unberührt.

on:
  push:
    branches:
      - claude/planigames-studio-site-4hngfe
    paths:
      - 'planigames/**'
  workflow_dispatch: {}   # erlaubt manuelles Auslösen im GitHub-Tab "Actions"

concurrency:
  group: deploy-allinkl
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Zielordner bestimmen (mit / am Ende)
        id: cfg
        env:
          DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          d="${DIR:-./}"
          case "$d" in */) ;; *) d="$d/";; esac
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Upload per FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Nur den PLANIGAMES-Ordner hochladen
          local-dir: ./planigames/
          server-dir: ${{ steps.cfg.outputs.dir }}
          # NIEMALS Inhalte/Logins/Settings überschreiben + Dev-Müll auslassen
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            data/**
            **/.DS_Store
            **/Thumbs.db
            **/*.md
            **/node_modules/**
